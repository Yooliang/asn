<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>#1852 設計稿</title>
<link rel="stylesheet" href="../../../relay/asn/ui/style.css">
<link rel="stylesheet" href="../../../relay/asn/ui/group.css">
<link rel="stylesheet" href="../../../relay/asn/ui/skin-common.css">
<link rel="stylesheet" href="../../../relay/asn/ui/modern.css">
<link rel="stylesheet" href="../../../relay/asn/ui/line.css">
<link rel="stylesheet" href="draft.css">
<script>
// 設計稿預覽用：網址帶 ?skin=aero、modern、line 換外觀（正式畫面是讀設定存的外觀）
(function () { var s = new URLSearchParams(location.search).get("skin") || "aero"; document.documentElement.setAttribute("data-skin", s) })()
</script>
</head>
<body class="draft">
<div class="win draft-win"><div class="shell"><div class="pane panel-pane">
<div class="list settings panel-set">
<h2 class="panel-h">視窗與系統匣</h2>
<label>關閉視窗時
  <select class="set-sel" aria-label="關閉視窗時"><option>縮到系統匣</option></select>
</label>
<label class="chk"><input type="checkbox" checked aria-label="登入時自動啟動 ASN" /><span>登入時自動啟動 ASN</span></label>
<label class="chk"><input type="checkbox" checked aria-label="ASN 意外關閉時自動重新開啟" /><span>ASN 意外關閉時自動重新開啟</span></label>
<small>只在 ASN 意外關閉時重開，你自己按結束不會重開。</small>
<section class="set-card" aria-label="收發信功能">
  <label class="chk"><input type="checkbox" checked aria-label="允許我的其他設備替這台開新視窗" /><span>允許我的其他設備替這台開新視窗</span></label>
  <small>新裝的電腦預設打開：你自己的其他設備（手機、別台電腦）可以替這台開新視窗。</small>
  <label class="chk"><input type="checkbox" checked aria-label="電腦重開後自動接回夥伴" /><span>電腦重開後自動接回夥伴</span></label>
  <small>重開前還開著、由 ASN 開的夥伴，登入 Windows 後會接回原本的對話。權限和原本相同，收到信就會繼續工作，也會用到額度。關掉就要自己按「喚醒」。</small>
  <label class="chk chk-num"><input type="checkbox" checked aria-label="壓縮自動交接" /><span>壓縮</span><input class="set-input num" type="number" min="2" max="10" value="3" aria-label="壓縮幾次" /><span>次自動交接</span></label>
  <small>Claude 視窗壓縮到這個次數時，額度夠就自動交給新視窗。取消勾選就只寄信提醒，不會自動交接。</small>
  <label class="chk"><input type="checkbox" checked aria-label="夥伴共用同一個終端服務" /><span>夥伴共用同一個終端服務</span></label>
  <small>改了要重開 ASN 才生效。</small>
  <label class="chk"><input type="checkbox" checked aria-label="夥伴卡住時跳提示" /><span>夥伴卡住時跳提示</span></label>
  <small>ASN 會定時看夥伴視窗的畫面，停在要你回答的地方時，在這台電腦跳提示。</small>
</section>
</div></div></div></div>
</body>
</html>
