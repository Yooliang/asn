name: ASN Linux 建置

on:
  push:
    branches: [main]
    paths:
      - 'relay/asn/**'
      - 'supabase/migrations/**'
      - 'supabase/sql/**'
      - 'tests/**'
      - 'tools/run-root-tests.mjs'
      - '.github/workflows/asn-linux-build.yml'
  pull_request:
    paths:
      - 'relay/asn/**'
      - 'supabase/migrations/**'
      - 'supabase/sql/**'
      - 'tests/**'
      - 'tools/run-root-tests.mjs'
      - '.github/workflows/asn-linux-build.yml'
  workflow_dispatch:

jobs:
  # 根目錄 SQL 測試（tests/*_sql.test.mjs）：裝 pglite（記憶體內 Postgres）真的套用 migration 實跑。
  # 版本固定 0.5.13（本機實際跑過的版本）；--no-save --no-package-lock：不產生、不改任何 package 檔。
  # --require-pglite：pglite 載不到就直接失敗；任何一支有子測試「因為 pglite」被略過也算失敗，不讓「略過」看起來像「通過」。
  #   （tenants_sql 有 3 項因舊 irori 額度邏輯固定略過，原因跟 pglite 無關，不算。）
  sql-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安裝 pglite（固定版本，不寫 package 檔）
        run: npm i --no-save --no-package-lock @electric-sql/pglite@0.5.13

      - name: 測試執行器本身的單元測試
        run: node --test tests/run_root_tests.test.mjs

      - name: 根目錄 SQL 測試（pglite 實跑，有略過就失敗）
        run: node tools/run-root-tests.mjs _sql --timeout=180 --require-pglite


  # 無視窗橋（asn-bridge，Linux 節點用）：下面的 build 只編 gui 版，這個組合沒人編就會壞了也不知道。
  # 刻意不裝 gtk／webkit：相依要是又牽到視窗函式庫，這裡也會紅。
  bridge-check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: relay/asn/src-tauri
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: relay/asn/src-tauri -> target
          key: bridge-check
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: 檢查無視窗橋能編譯
        run: cargo check --locked --no-default-features --bin asn-bridge

  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: relay/asn
    steps:
      - uses: actions/checkout@v4

      - name: 安裝系統依賴
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libjavascriptcoregtk-4.1-dev libsoup-3.0-dev patchelf xvfb scrot

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: relay/asn/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      # Rust 編譯快取（target 與 ~/.cargo）：CI 一次要 9～10 分鐘，大多花在重編相依套件。
      # 以 Cargo.lock 與工具鏈為鍵，相依沒變就直接沿用；只有 main 的推送會更新快取，PR 只讀。
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: relay/asn/src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: 安裝前端依賴
        run: npm ci

      - name: 單元測試（Node）
        run: npm test

      - name: 單元測試（Rust）
        run: npm run test:rust

      - name: 建置 deb 與 AppImage
        run: npm run build

      - name: 上傳成品
        uses: actions/upload-artifact@v4
        with:
          name: asn-linux-${{ github.sha }}
          path: |
            relay/asn/src-tauri/target/release/bundle/deb/*.deb
            relay/asn/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
