name: ASN Linux 建置

on:
  push:
    branches: [main]
    paths:
      - 'relay/asn/**'
      - 'supabase/migrations/**'
      - 'supabase/sql/**'
      - 'tests/**'
      - 'tools/run-root-tests.mjs'
      - 'supabase/functions/_shared/login_domains.json'
      - 'supabase/functions/_shared/secret_remote.ts'
      - '.github/workflows/asn-linux-build.yml'
  pull_request:
    paths:
      - 'relay/asn/**'
      - 'supabase/migrations/**'
      - 'supabase/sql/**'
      - 'tests/**'
      - 'tools/run-root-tests.mjs'
      - 'supabase/functions/_shared/login_domains.json'
      - 'supabase/functions/_shared/secret_remote.ts'
      - '.github/workflows/asn-linux-build.yml'
  workflow_dispatch:

# 整支 workflow 只讀（#947）：所有 job 只跑測試、建置與上傳成品，都不需要寫入 repo。
# 快取（setup-node、rust-cache）與上傳成品走 Actions 自己的權杖，不受這裡限制。
permissions:
  contents: read

jobs:
  # 根目錄 SQL 測試（tests/*_sql.test.mjs）：裝 pglite（記憶體內 Postgres）真的套用 migration 實跑。
  # 版本固定 0.5.13（本機實際跑過的版本）；--no-save --no-package-lock：不產生、不改任何 package 檔。
  # --require-pglite：pglite 載不到就直接失敗；任何一支有子測試「因為 pglite」被略過也算失敗，不讓「略過」看起來像「通過」。
  #   （tenants_sql 有 3 項因舊 irori 額度邏輯固定略過，原因跟 pglite 無關，不算。）
  sql-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: 安裝 pglite（固定版本，不寫 package 檔）
        run: npm i --no-save --no-package-lock @electric-sql/pglite@0.5.13

      - name: 測試執行器本身的單元測試
        run: node --test tests/run_root_tests.test.mjs

      - name: 根目錄 SQL 測試（pglite 實跑，有略過就失敗）＋登入網域清單的一致性測試
        timeout-minutes: 21 # 最後一道防線（#1379）：全部 95 支逐檔跑，本機實測約 10 分鐘（每支 PGlite 啟動約 1 秒，多數檔有好幾項測試），取兩倍向上取整
        run: node tools/run-root-tests.mjs _sql login_domains --timeout=180 --require-pglite


  # 無視窗橋（asn-bridge，Linux 節點用）：下面的 build 只編 gui 版，這個組合沒人編就會壞了也不知道。
  # 刻意不裝 gtk／webkit：相依要是又牽到視窗函式庫，這裡也會紅。
  bridge-check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: relay/asn/src-tauri
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable 分支頂端；版本由 toolchain: stable 指定
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: relay/asn/src-tauri -> target
          key: bridge-check
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: 檢查無視窗橋能編譯
        run: cargo check --locked --no-default-features --bin asn-bridge

  # 無畫面（不含視窗介面）的程式第一次真的跑測試：不裝 gtk／webkit，和 asn-bridge 在無畫面 Linux 上的編法相同（--no-default-features）。
  # 跑不過的測試不用 cfg 關掉（那樣看起來綠、其實沒測），一律列在 scripts/headless-test-skip.txt 逐條 --skip，log 會印出略過了哪幾條
  headless-test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: relay/asn/src-tauri
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable 分支頂端；版本由 toolchain: stable 指定
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: relay/asn/src-tauri -> target
          key: headless-test
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: 無畫面跑單元測試
        shell: bash
        run: |
          echo "headless 少驗 7 處斷言（轉交逾時／登入失效紀錄，只有視窗版會產生），見 PR 內文"
          mapfile -t skips < <(tr -d '\r' < ../scripts/headless-test-skip.txt | grep -v '^[[:space:]]*#' | sed '/^[[:space:]]*$/d')
          echo "略過 ${#skips[@]} 條（清單：relay/asn/scripts/headless-test-skip.txt）"
          for t in "${skips[@]}"; do echo "  - $t"; done
          args=()
          for t in "${skips[@]}"; do args+=(--skip "$t"); done
          cargo test --locked --no-default-features --lib -- "${args[@]}"

      # 產品的 Mux 與真的 RealRunner 在 Linux 上真的起 wezterm-mux-server、開窗格、get-text（#893）。版本與雜湊和 asn-wezterm-linux-probe 同一組；沒有 DISPLAY
      # Linux 按需取得 WezTerm（#893 第 3 張）：空的資料夾、PATH 沒有 wezterm、不設 ASN_WEZTERM_DIR，產品的取得流程真的連 GitHub 下載固定版本、核對雜湊、解壓、跑 --version，
      # 再讓 locate 找得到；之後的步驟拿取得的那份跑 mux 實測（取得流程 → 實際可用）
      - name: Linux 真的下載取得 WezTerm（固定版本、核對雜湊）
        shell: bash
        run: |
          set -euo pipefail
          export XDG_DATA_HOME="$RUNNER_TEMP/xdg"
          rm -rf "$XDG_DATA_HOME"; mkdir -p "$XDG_DATA_HOME"
          unset ASN_WEZTERM_DIR DISPLAY WAYLAND_DISPLAY
          command -v wezterm && { echo "runner 上不該有 wezterm"; exit 1; } || true
          # 外部下載不穩（GitHub 5xx、逾時）才重試，最多 3 次；每次重試前清空資料夾（不然產品的退避紀錄會讓下一次直接略過）
          bash "$GITHUB_WORKSPACE/.github/scripts/retry-external.sh" "Linux 取得 WezTerm" --before 'rm -rf "$XDG_DATA_HOME"; mkdir -p "$XDG_DATA_HOME"' -- cargo test --locked --no-default-features --lib launch::wezterm_fetch::tests::linux_real_fetch_wezterm -- --ignored --test-threads=1 --nocapture
          echo "ASN_FETCHED_DIR=$(ls -d "$XDG_DATA_HOME"/ASN/wezterm/*-ubuntu-*/ | head -1)" >> "$GITHUB_ENV"
          ls -la "$XDG_DATA_HOME"/ASN/wezterm/*/

      - name: 用取得的 WezTerm 起 mux、開窗格、get-text
        shell: bash
        run: |
          set -euo pipefail
          export ASN_WEZTERM_DIR="${ASN_FETCHED_DIR%/}"
          unset DISPLAY WAYLAND_DISPLAY
          cargo test --locked --no-default-features --lib launch::mux::tests::linux_real_mux_spawn_get_text -- --ignored --test-threads=1 --nocapture

      - name: Linux 真的 WezTerm 起 mux、開窗格、get-text
        shell: bash
        env:
          WEZTERM_VERSION: '20240203-110809-5046fc22'
          TAR_SHA256: '142cb46de648200b852cc4b1d932e6b8f2a9d3c55f6dc5af44b6d4eeb9385f5c'
        run: |
          set -euo pipefail
          tar_name="wezterm-${WEZTERM_VERSION}.Ubuntu22.04.tar.xz"
          curl -fsSL --retry 3 --retry-delay 15 -o "$RUNNER_TEMP/$tar_name" "https://github.com/wezterm/wezterm/releases/download/${WEZTERM_VERSION}/${tar_name}"
          echo "${TAR_SHA256}  $RUNNER_TEMP/$tar_name" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/wz" && tar -xJf "$RUNNER_TEMP/$tar_name" -C "$RUNNER_TEMP/wz"
          export ASN_WEZTERM_DIR="$RUNNER_TEMP/wz/wezterm/usr/bin"
          test -x "$ASN_WEZTERM_DIR/wezterm" && test -x "$ASN_WEZTERM_DIR/wezterm-mux-server"
          unset DISPLAY WAYLAND_DISPLAY
          cargo test --locked --no-default-features --lib launch::mux::tests::linux_real_mux_spawn_get_text -- --ignored --test-threads=1 --nocapture

      - name: 沒有金鑰庫時設備金鑰照用、但不能讓別台看
        shell: bash
        run: env -u DBUS_SESSION_BUS_ADDRESS cargo test --locked --no-default-features --lib keystore::without_secret_service_tests -- --ignored --test-threads=1

  # 手機版：`launch` 這類只有電腦版才編的模組，手機版用到就編不過（0.2.3 發版時才發現，#788）。
  # 其他工作都編 Linux 目標，抓不到；這裡只檢查 Rust 能不能編，不打包、不簽章。目標和 release-play.mjs 相同（arm64），API 版本和 minSdk 相同（26）。
  android-check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: relay/asn/src-tauri
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable 分支頂端；版本由 toolchain: stable 指定
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: relay/asn/src-tauri -> target
          key: android-check
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: 設定 NDK 編譯器（ring 要用）
        run: |
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$bin/aarch64-linux-android26-clang"
          {
            echo "CC_aarch64_linux_android=$bin/aarch64-linux-android26-clang"
            echo "AR_aarch64_linux_android=$bin/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$bin/aarch64-linux-android26-clang"
          } >> "$GITHUB_ENV"

      - name: 檢查手機版能編譯
        run: cargo check --locked --target aarch64-linux-android --lib

  # 手機版 Kotlin/Gradle 編譯檢查：android-check 只編 Rust，Kotlin 與 gradle 設定出包才會知道編不編得過。
  # 只編 Kotlin（:app:compileUniversalDebugKotlin），不編 Rust 的 .so、不簽章、不上傳成品、不碰 secrets；權限只讀。
  # Tauri 的 gradle 檔（tauri.settings.gradle / tauri.build.gradle.kts）是 tauri-build 在 cargo 建置時產生的，不進 repo，
  # 所以先跑一次 cargo check（沿用 android-check 的快取）讓它產生；compileKotlin 不依賴 rustBuild* 任務，gradle 不會呼叫 npm / tauri。
  android-kotlin:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # 驗 gradle-wrapper.jar 的 SHA-256 是否為 Gradle 官方發布版（固定到完整 commit，對應 v6.4.1）
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable 分支頂端；版本由 toolchain: stable 指定
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: relay/asn/src-tauri -> target
          key: android-check
          save-if: false

      - name: 設定 NDK 編譯器（ring 要用）
        run: |
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$bin/aarch64-linux-android26-clang"
          {
            echo "CC_aarch64_linux_android=$bin/aarch64-linux-android26-clang"
            echo "AR_aarch64_linux_android=$bin/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$bin/aarch64-linux-android26-clang"
          } >> "$GITHUB_ENV"

      - name: 確認沒有 google-services.json（沒有這個檔也要編得過）
        run: |
          if [ -e relay/asn/src-tauri/gen/android/app/google-services.json ]; then
            echo "google-services.json 不該存在於 CI" >&2; exit 1
          fi

      - name: 產生 Tauri 的 gradle 檔（cargo check 觸發 tauri-build）
        working-directory: relay/asn/src-tauri
        env:
          TAURI_ANDROID_PROJECT_PATH: ${{ github.workspace }}/relay/asn/src-tauri/gen/android
        # WRY_ANDROID_* 是 tauri CLI 出包時會設的；tauri 的 build.rs 靠它們產生 Kotlin 橋接檔（generated/，不進 repo）。
        # 不寫死：套件名取自 tauri.conf.json 的 identifier、函式庫名取自 Cargo.toml 的 [lib] name，和正式出包同一份來源
        run: |
          set -euo pipefail
          pkg="$(node -p "require('./tauri.conf.json').identifier")"
          lib="$(awk '/^\[lib\]/{f=1;next} /^\[/{f=0} f && /^name *=/{gsub(/^name *= *"|"$/,"");print;exit}' Cargo.toml)"
          [[ "$pkg" =~ ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$ ]] || { echo "identifier 讀不到或格式不對：$pkg" >&2; exit 1; }
          [[ "$lib" =~ ^[a-z][a-z0-9_]*$ ]] || { echo "[lib] name 讀不到或格式不對：$lib" >&2; exit 1; }
          out="$PWD/gen/android/app/src/main/java/${pkg//.//}/generated"
          test -f "gen/android/app/src/main/java/${pkg//.//}/MainActivity.kt" || { echo "identifier（$pkg）和 Kotlin 套件路徑對不上" >&2; exit 1; }
          echo "WRY_ANDROID_PACKAGE=$pkg WRY_ANDROID_LIBRARY=$lib"
          mkdir -p "$out"
          WRY_ANDROID_PACKAGE="$pkg" WRY_ANDROID_LIBRARY="$lib" WRY_ANDROID_KOTLIN_FILES_OUT_DIR="$out" cargo check --locked --target aarch64-linux-android --lib
          ls -la gen/android/tauri.settings.gradle gen/android/app/tauri.build.gradle.kts

      # gradle 發行包快取：**只存下載回來的 zip**（不存解開後的檔），key 綁 gradle-wrapper.properties，換版本就換 key
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.gradle/wrapper/dists/*/*/*.zip
          key: gradle-wrapper-zip-${{ hashFiles('relay/asn/src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties') }}

      # 快取來的 zip 自己用 sha256sum 對 distributionSha256Sum 驗，不合就刪掉（wrapper 會重抓）；
      # 另外刪掉解開的資料夾與完成記號，讓 wrapper 從驗過的 zip 重新解開（wrapper 對已解開的檔不會再驗）
      - name: 核對快取的 gradle 發行包
        shell: bash
        run: |
          set -euo pipefail
          props=relay/asn/src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties
          want="$(sed -n 's/^distributionSha256Sum=//p' "$props" | tr -d '\r')"
          [[ "$want" =~ ^[0-9a-f]{64}$ ]] || { echo "distributionSha256Sum 讀不到或格式不對" >&2; exit 1; }
          shopt -s nullglob
          for z in "$HOME"/.gradle/wrapper/dists/*/*/*.zip; do
            got="$(sha256sum "$z" | cut -d' ' -f1)"
            if [ "$got" = "$want" ]; then echo "快取的發行包雜湊相符：$z"; else echo "::warning::快取的發行包雜湊不符，刪掉重抓：$z"; rm -f "$z"; fi
          done
          for d in "$HOME"/.gradle/wrapper/dists/*/*/; do
            find "$d" -mindepth 1 -maxdepth 1 ! -name '*.zip' -exec rm -rf {} +
          done

      - name: 編 Kotlin（Android，不含 Rust .so）
        working-directory: relay/asn/src-tauri/gen/android
        # 下載 gradle 發行包碰到 5xx／逾時才重試（wrapper 自己只試一次），最多 3 次；編譯錯誤照常立刻紅
        run: bash "$GITHUB_WORKSPACE/.github/scripts/retry-external.sh" "下載 gradle 並編 Kotlin" -- sh ./gradlew --no-daemon --console=plain :app:compileUniversalDebugKotlin

      # 掃 QR code（zxing-android-embedded）的把關：解碼核心要解析成 3.5.4、函式庫不能順便拉進 Google 服務或 Firebase；
      # 合併後的清單不能留函式庫內建的 CaptureActivity、除了主畫面沒有別的 activity 對外開放。印出來讓審 PR 的人直接看。
      # 兩步都只解析相依與合併清單，不編 Rust、不簽章、不上傳。
      - name: 檢查 zxing 相依（core 要是 3.5.4、不拉 gms／firebase）
        working-directory: relay/asn/src-tauri/gen/android
        run: |
          set -euo pipefail
          deps="$RUNNER_TEMP/asn-release-deps.txt"
          bash "$GITHUB_WORKSPACE/.github/scripts/retry-external.sh" "解析 release 相依" -- sh -c "sh ./gradlew --no-daemon --console=plain :app:dependencies --configuration universalReleaseRuntimeClasspath > \"$deps\""
          echo "=== 含 zxing 的行 ==="
          grep -i 'zxing' "$deps" || { echo "::error::相依樹裡找不到 zxing"; exit 1; }
          echo "=== zxing-android-embedded 底下的子樹 ==="
          awk '
            /zxing-android-embedded/ && !on { on = 1; start = index($0, "--- "); print; next }
            on {
              idx = index($0, "--- ")
              if (idx > 0 && idx <= start) { on = 0; next }
              if ($0 ~ /^[[:space:]]*$/) { on = 0; next }
              print
            }
          ' "$deps" | tee "$RUNNER_TEMP/asn-zxing-subtree.txt"
          if grep -Eiq 'com\.google\.android\.gms|firebase' "$RUNNER_TEMP/asn-zxing-subtree.txt"; then
            echo "::error::zxing 的相依裡有 com.google.android.gms 或 firebase"; exit 1
          fi
          core="$(grep -E 'com\.google\.zxing:core:' "$deps" || true)"
          [ -n "$core" ] || { echo "::error::相依樹裡找不到 com.google.zxing:core"; exit 1; }
          bad="$(printf '%s\n' "$core" | grep -Ev 'com\.google\.zxing:core:(3\.5\.4|[0-9.]+ -> 3\.5\.4)( \(\*\))?[[:space:]]*$' || true)"
          if [ -n "$bad" ]; then
            echo "::error::com.google.zxing:core 沒有解析成 3.5.4："; printf '%s\n' "$bad"; exit 1
          fi
          echo "com.google.zxing:core 解析成 3.5.4"

      # processUniversalReleaseMainManifest：只做清單合併（函式庫的清單、tools:node="remove"、置換字串），不編碼、不編 Rust；
      # 變體 universalRelease 與上面編 Kotlin 的 universal 是同一個 abi 面向（Tauri 的 universal）。
      - name: 檢查合併後的清單（沒有 CaptureActivity、只有主畫面對外開放）
        working-directory: relay/asn/src-tauri/gen/android
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/.github/scripts/retry-external.sh" "合併 release 清單" -- sh ./gradlew --no-daemon --console=plain :app:processUniversalReleaseMainManifest
          files="$(find app/build/intermediates -type f -name AndroidManifest.xml -path '*universalRelease*' -path '*merged_manifest*' | sort)"
          [ -n "$files" ] || { echo "::error::找不到合併後的 AndroidManifest.xml"; find app/build/intermediates -name AndroidManifest.xml | head -20; exit 1; }
          fail=0
          while IFS= read -r f; do
            echo "=== $f ==="
            flat="$(tr '\r\n' '  ' < "$f")"
            echo "--- uses-permission ---"
            printf '%s' "$flat" | grep -oE '<uses-permission[^>]*>' | sed 's/  */ /g' || true
            echo "--- activity ---"
            acts="$(printf '%s' "$flat" | grep -oE '<activity[^>]*>' | sed 's/  */ /g' || true)"
            printf '%s\n' "$acts"
            if printf '%s' "$acts" | grep -q 'CaptureActivity'; then
              echo "::error::合併後的清單還有 CaptureActivity（$f）"; fail=1
            fi
            if printf '%s\n' "$acts" | grep 'android:exported="true"' | grep -Ev 'android:name="(tw\.yooliang\.asn)?\.MainActivity"' | grep -q .; then
              echo "::error::主畫面以外還有對外開放的 activity（$f）"
              printf '%s\n' "$acts" | grep 'android:exported="true"' | grep -Ev 'android:name="(tw\.yooliang\.asn)?\.MainActivity"' || true
              fail=1
            fi
            printf '%s' "$acts" | grep -q 'FingerprintScanActivity' || { echo "::error::合併後的清單沒有自己的掃描畫面（$f）"; fail=1; }
          done <<< "$files"
          exit "$fail"

  # 電腦版（Windows）：只有 Windows 才編的程式（#[cfg(windows)]，例如 Windows Hello、DPAPI）其他工作都編不到（#945 發現）。
  # 這裡只檢查 Rust 能不能編，不打包、不跑測試、不碰任何 secrets；權限只讀。
  windows-check:
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: relay/asn/src-tauri
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable 分支頂端；版本由 toolchain: stable 指定
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: relay/asn/src-tauri -> target
          key: windows-check
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: 檢查電腦版（Windows）能編譯
        run: cargo check --locked --lib

  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: relay/asn
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # apt 鏡像偶爾整個卡住（11-11 Azure 鏡像抓不下套件，連續幾個 run 卡在這一步一小時以上）：
      # apt-install.sh 先用預設鏡像、失敗才換官方站再試一次，每段都有 timeout；整步限 15 分鐘，卡住就失敗、不佔住機器
      - name: 安裝系統依賴
        timeout-minutes: 15
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/apt-install.sh" build-essential pkg-config libssl-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libjavascriptcoregtk-4.1-dev libsoup-3.0-dev patchelf xvfb scrot

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: relay/asn/package-lock.json

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable 分支頂端；版本由 toolchain: stable 指定
        with:
          toolchain: stable

      # Rust 編譯快取（target 與 ~/.cargo）：CI 一次要 9～10 分鐘，大多花在重編相依套件。
      # 以 Cargo.lock 與工具鏈為鍵，相依沒變就直接沿用；只有 main 的推送會更新快取，PR 只讀。
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: relay/asn/src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: 安裝前端依賴
        run: npm ci

      - name: 單元測試（Node）
        run: npm test

      - name: 單元測試（Rust）
        run: npm run test:rust
      # 系統金鑰庫（Secret Service）的整合測試：起一個只在這次工作裡的 dbus＋gnome-keyring，金鑰圈用固定測試密碼解鎖。
      # 平常是 ignored，只在這裡明確跑；不碰任何真的帳號或 secrets
      - name: 安裝系統金鑰庫測試依賴
        timeout-minutes: 15
        run: bash "$GITHUB_WORKSPACE/.github/scripts/apt-install.sh" --no-install-recommends gnome-keyring dbus-daemon
      - name: 系統金鑰庫整合測試（Linux）
        working-directory: relay/asn/src-tauri
        run: |
          dbus-run-session -- sh -ec 'printf asn-ci | gnome-keyring-daemon --unlock --components=secrets >/dev/null; cargo test --locked --lib keystore::linux -- --ignored --test-threads=1'

      # 打包 AppImage 時 tauri 會從 GitHub 抓 AppRun 等工具：外部服務 5xx／逾時才重試，最多 3 次，其他失敗照常紅。
      # 重試前清掉上一次留下的半套 AppImage 輸出與 tauri 的工具快取（下載到一半的檔會讓 linuxdeploy 壞掉）
      - name: 建置 deb 與 AppImage
        run: bash "$GITHUB_WORKSPACE/.github/scripts/retry-external.sh" "建置 deb 與 AppImage" --before 'rm -rf "$GITHUB_WORKSPACE/relay/asn/src-tauri/target/release/bundle/appimage" "$HOME/.cache/tauri"' -- npm run build

      # 上面的 npm test 還沒有成品，這幾支會略過；#652 改欄位後過期就是這樣沒人發現（#719）
      - name: 需要成品的測試（端到端）
        timeout-minutes: 15
        run: xvfb-run -a node --test --test-timeout=600000 test/e2e.test.mjs test/launch-cwd.test.mjs test/login.test.mjs test/partner-launch-notice-shot.test.mjs

      - name: 冒煙測試（畫面啟動）
        run: node scripts/smoke-ui.mjs

      - name: 上傳成品
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: asn-linux-${{ github.sha }}
          path: |
            relay/asn/src-tauri/target/release/bundle/deb/*.deb
            relay/asn/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
