name: ASN Linux 建置

on:
  push:
    branches: [main]
    paths:
      - 'relay/asn/**'
      - 'supabase/migrations/**'
      - 'supabase/sql/**'
      - 'tests/**'
      - 'tools/run-root-tests.mjs'
      - '.github/workflows/asn-linux-build.yml'
  pull_request:
    paths:
      - 'relay/asn/**'
      - 'supabase/migrations/**'
      - 'supabase/sql/**'
      - 'tests/**'
      - 'tools/run-root-tests.mjs'
      - '.github/workflows/asn-linux-build.yml'
  workflow_dispatch:

# 整支 workflow 只讀（#947）：所有 job 只跑測試、建置與上傳成品，都不需要寫入 repo。
# 快取（setup-node、rust-cache）與上傳成品走 Actions 自己的權杖，不受這裡限制。
permissions:
  contents: read

jobs:
  # 根目錄 SQL 測試（tests/*_sql.test.mjs）：裝 pglite（記憶體內 Postgres）真的套用 migration 實跑。
  # 版本固定 0.5.13（本機實際跑過的版本）；--no-save --no-package-lock：不產生、不改任何 package 檔。
  # --require-pglite：pglite 載不到就直接失敗；任何一支有子測試「因為 pglite」被略過也算失敗，不讓「略過」看起來像「通過」。
  #   （tenants_sql 有 3 項因舊 irori 額度邏輯固定略過，原因跟 pglite 無關，不算。）
  sql-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安裝 pglite（固定版本，不寫 package 檔）
        run: npm i --no-save --no-package-lock @electric-sql/pglite@0.5.13

      - name: 測試執行器本身的單元測試
        run: node --test tests/run_root_tests.test.mjs

      - name: 根目錄 SQL 測試（pglite 實跑，有略過就失敗）
        run: node tools/run-root-tests.mjs _sql --timeout=180 --require-pglite


  # 無視窗橋（asn-bridge，Linux 節點用）：下面的 build 只編 gui 版，這個組合沒人編就會壞了也不知道。
  # 刻意不裝 gtk／webkit：相依要是又牽到視窗函式庫，這裡也會紅。
  bridge-check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: relay/asn/src-tauri
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: relay/asn/src-tauri -> target
          key: bridge-check
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: 檢查無視窗橋能編譯
        run: cargo check --locked --no-default-features --bin asn-bridge

  # 無畫面（不含視窗介面）的程式第一次真的跑測試：不裝 gtk／webkit，和 asn-bridge 在無畫面 Linux 上的編法相同（--no-default-features）。
  # 跑不過的測試不用 cfg 關掉（那樣看起來綠、其實沒測），一律列在 scripts/headless-test-skip.txt 逐條 --skip，log 會印出略過了哪幾條
  headless-test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: relay/asn/src-tauri
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: relay/asn/src-tauri -> target
          key: headless-test
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: 無畫面跑單元測試
        shell: bash
        run: |
          echo "headless 少驗 7 處斷言（轉交逾時／登入失效紀錄，只有視窗版會產生），見 PR 內文"
          mapfile -t skips < <(tr -d '\r' < ../scripts/headless-test-skip.txt | grep -v '^[[:space:]]*#' | sed '/^[[:space:]]*$/d')
          echo "略過 ${#skips[@]} 條（清單：relay/asn/scripts/headless-test-skip.txt）"
          for t in "${skips[@]}"; do echo "  - $t"; done
          args=()
          for t in "${skips[@]}"; do args+=(--skip "$t"); done
          cargo test --locked --no-default-features --lib -- "${args[@]}"

      # 產品的 Mux 與真的 RealRunner 在 Linux 上真的起 wezterm-mux-server、開窗格、get-text（#893）。版本與雜湊和 asn-wezterm-linux-probe 同一組；沒有 DISPLAY
      # Linux 按需取得 WezTerm（#893 第 3 張）：空的資料夾、PATH 沒有 wezterm、不設 ASN_WEZTERM_DIR，產品的取得流程真的連 GitHub 下載固定版本、核對雜湊、解壓、跑 --version，
      # 再讓 locate 找得到；之後的步驟拿取得的那份跑 mux 實測（取得流程 → 實際可用）
      - name: Linux 真的下載取得 WezTerm（固定版本、核對雜湊）
        shell: bash
        run: |
          set -euo pipefail
          export XDG_DATA_HOME="$RUNNER_TEMP/xdg"
          rm -rf "$XDG_DATA_HOME"; mkdir -p "$XDG_DATA_HOME"
          unset ASN_WEZTERM_DIR DISPLAY WAYLAND_DISPLAY
          command -v wezterm && { echo "runner 上不該有 wezterm"; exit 1; } || true
          cargo test --locked --no-default-features --lib launch::wezterm_fetch::tests::linux_real_fetch_wezterm -- --ignored --test-threads=1 --nocapture
          echo "ASN_FETCHED_DIR=$(ls -d "$XDG_DATA_HOME"/ASN/wezterm/*-ubuntu-*/ | head -1)" >> "$GITHUB_ENV"
          ls -la "$XDG_DATA_HOME"/ASN/wezterm/*/

      - name: 用取得的 WezTerm 起 mux、開窗格、get-text
        shell: bash
        run: |
          set -euo pipefail
          export ASN_WEZTERM_DIR="${ASN_FETCHED_DIR%/}"
          unset DISPLAY WAYLAND_DISPLAY
          cargo test --locked --no-default-features --lib launch::mux::tests::linux_real_mux_spawn_get_text -- --ignored --test-threads=1 --nocapture

      - name: Linux 真的 WezTerm 起 mux、開窗格、get-text
        shell: bash
        env:
          WEZTERM_VERSION: '20240203-110809-5046fc22'
          TAR_SHA256: '142cb46de648200b852cc4b1d932e6b8f2a9d3c55f6dc5af44b6d4eeb9385f5c'
        run: |
          set -euo pipefail
          tar_name="wezterm-${WEZTERM_VERSION}.Ubuntu22.04.tar.xz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$tar_name" "https://github.com/wezterm/wezterm/releases/download/${WEZTERM_VERSION}/${tar_name}"
          echo "${TAR_SHA256}  $RUNNER_TEMP/$tar_name" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/wz" && tar -xJf "$RUNNER_TEMP/$tar_name" -C "$RUNNER_TEMP/wz"
          export ASN_WEZTERM_DIR="$RUNNER_TEMP/wz/wezterm/usr/bin"
          test -x "$ASN_WEZTERM_DIR/wezterm" && test -x "$ASN_WEZTERM_DIR/wezterm-mux-server"
          unset DISPLAY WAYLAND_DISPLAY
          cargo test --locked --no-default-features --lib launch::mux::tests::linux_real_mux_spawn_get_text -- --ignored --test-threads=1 --nocapture

      - name: 沒有金鑰庫時設備金鑰照用、但不能讓別台看
        shell: bash
        run: env -u DBUS_SESSION_BUS_ADDRESS cargo test --locked --no-default-features --lib keystore::without_secret_service_tests -- --ignored --test-threads=1

  # 手機版：`launch` 這類只有電腦版才編的模組，手機版用到就編不過（0.2.3 發版時才發現，#788）。
  # 其他工作都編 Linux 目標，抓不到；這裡只檢查 Rust 能不能編，不打包、不簽章。目標和 release-play.mjs 相同（arm64），API 版本和 minSdk 相同（26）。
  android-check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: relay/asn/src-tauri
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: relay/asn/src-tauri -> target
          key: android-check
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: 設定 NDK 編譯器（ring 要用）
        run: |
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$bin/aarch64-linux-android26-clang"
          {
            echo "CC_aarch64_linux_android=$bin/aarch64-linux-android26-clang"
            echo "AR_aarch64_linux_android=$bin/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$bin/aarch64-linux-android26-clang"
          } >> "$GITHUB_ENV"

      - name: 檢查手機版能編譯
        run: cargo check --locked --target aarch64-linux-android --lib

  # 電腦版（Windows）：只有 Windows 才編的程式（#[cfg(windows)]，例如 Windows Hello、DPAPI）其他工作都編不到（#945 發現）。
  # 這裡只檢查 Rust 能不能編，不打包、不跑測試、不碰任何 secrets；權限只讀。
  windows-check:
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: relay/asn/src-tauri
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: relay/asn/src-tauri -> target
          key: windows-check
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: 檢查電腦版（Windows）能編譯
        run: cargo check --locked --lib

  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: relay/asn
    steps:
      - uses: actions/checkout@v4

      - name: 安裝系統依賴
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libjavascriptcoregtk-4.1-dev libsoup-3.0-dev patchelf xvfb scrot

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: relay/asn/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      # Rust 編譯快取（target 與 ~/.cargo）：CI 一次要 9～10 分鐘，大多花在重編相依套件。
      # 以 Cargo.lock 與工具鏈為鍵，相依沒變就直接沿用；只有 main 的推送會更新快取，PR 只讀。
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: relay/asn/src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: 安裝前端依賴
        run: npm ci

      - name: 單元測試（Node）
        run: npm test

      - name: 單元測試（Rust）
        run: npm run test:rust
      # 系統金鑰庫（Secret Service）的整合測試：起一個只在這次工作裡的 dbus＋gnome-keyring，金鑰圈用固定測試密碼解鎖。
      # 平常是 ignored，只在這裡明確跑；不碰任何真的帳號或 secrets
      - name: 系統金鑰庫整合測試（Linux）
        working-directory: relay/asn/src-tauri
        run: |
          sudo apt-get install -y --no-install-recommends gnome-keyring dbus-daemon
          dbus-run-session -- sh -ec 'printf asn-ci | gnome-keyring-daemon --unlock --components=secrets >/dev/null; cargo test --locked --lib keystore::linux -- --ignored --test-threads=1'

      - name: 建置 deb 與 AppImage
        run: npm run build

      # 上面的 npm test 還沒有成品，這幾支會略過；#652 改欄位後過期就是這樣沒人發現（#719）
      - name: 需要成品的測試（端到端）
        timeout-minutes: 15
        run: xvfb-run -a node --test --test-timeout=600000 test/e2e.test.mjs test/launch-cwd.test.mjs test/login.test.mjs test/partner-launch-notice-shot.test.mjs

      - name: 冒煙測試（畫面啟動）
        run: node scripts/smoke-ui.mjs

      - name: 上傳成品
        uses: actions/upload-artifact@v4
        with:
          name: asn-linux-${{ github.sha }}
          path: |
            relay/asn/src-tauri/target/release/bundle/deb/*.deb
            relay/asn/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
