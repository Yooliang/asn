name: ASN Linux 建置

on:
  push:
    branches: [main]
    paths:
      - 'relay/asn/**'
      - '.github/workflows/asn-linux-build.yml'
  pull_request:
    paths:
      - 'relay/asn/**'
      - '.github/workflows/asn-linux-build.yml'
  workflow_dispatch:

jobs:
  build:
    # 自架 runner（aegis-tokyo-yooliang-asn）：系統套件、Rust、xvfb 已由主機管理者預先裝好，所以不再 sudo apt-get。
    # 公開後 fork 來的 PR 不得跑在自架 runner（會執行外人的程式），下面的 if 只放行本倉庫的 PR／push／手動觸發。
    runs-on: [self-hosted, yooliang]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    defaults:
      run:
        working-directory: relay/asn
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: relay/asn/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: 安裝前端依賴
        run: npm ci

      - name: 單元測試（Node）
        run: npm test

      - name: 單元測試（Rust）
        run: npm run test:rust

      - name: 建置 deb 與 AppImage
        run: npm run build

      - name: 上傳成品
        uses: actions/upload-artifact@v4
        with:
          name: asn-linux-${{ github.sha }}
          path: |
            relay/asn/src-tauri/target/release/bundle/deb/*.deb
            relay/asn/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
