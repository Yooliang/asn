name: ASN 後端與機器橋測試

# 和 asn-linux-build.yml 分開：這些測試不連 Rust，約兩分鐘跑完。
# 每張 PR 都跑、不篩路徑：有跨資料夾的守門（例如 legacy_env 會讀 envc.rs），用路徑篩選就會漏（#685）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 整支 workflow 只讀（#947）：所有 job 只跑測試、建置與上傳成品，都不需要寫入 repo。
# 快取（setup-node、rust-cache）與上傳成品走 Actions 自己的權杖，不受這裡限制。
permissions:
  contents: read

jobs:
  edge-functions:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # setup-deno 從外部下載 deno，偶爾碰到 5xx：第一次失敗不讓整個工作停（continue-on-error），等 30 秒再試一次；
      # 第二次仍失敗就照常紅（不放水）。版本照舊鎖 2.9.3，兩次用同一個 commit、同一個版本
      - id: deno1
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        continue-on-error: true
        with:
          deno-version: '2.9.3'

      - name: setup-deno 第一次失敗，等 30 秒再試
        if: steps.deno1.outcome == 'failure'
        run: |
          echo "::warning::setup-deno 第一次失敗（多半是外部下載 5xx／逾時），30 秒後重試一次"
          sleep 30

      - id: deno2
        if: steps.deno1.outcome == 'failure'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: '2.9.3'

      - name: 確認 deno 版本
        run: |
          set -euo pipefail
          v="$(deno --version | head -1)"
          echo "$v"
          [[ "$v" == "deno 2.9.3 "* ]] || { echo "deno 版本不對：$v" >&2; exit 1; }

      - name: Edge Function 測試（deno）
        run: deno test -A _shared/

  relay-machine:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: relay/machine
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: 機器橋測試（node）
        run: node --test --test-force-exit --test-timeout=120000 test/*.test.mjs

  relay-cloud-agent:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: relay/cloud-agent
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: 雲端代理測試（node）
        run: node --test --test-force-exit --test-timeout=120000 test/*.test.mjs
