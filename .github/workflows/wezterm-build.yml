name: 診斷 symbolize（#1318，診斷分支，不合併）
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  symbolize:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wezterm-mux-server-pdb
          run-id: '44662864799'
          repository: Yooliang/asn
          github-token: ${{ github.token }}
          path: pdb
      - name: 查符號
        run: |
          find pdb -type f | head
          EXE=$(find pdb -name wezterm-mux-server.exe | head -1)
          PDBDIR=$(dirname "$(find pdb -name wezterm_mux_server.pdb | head -1)")
          RVAS="754290 7544b0 76720 7559c0 753d10 753d3a 753ee6 7547d0 7549c3 7556f0 755752"
          python .github/scripts/diag-symbolize.py "$(cygpath -w "$EXE")" "$(cygpath -w "$PDBDIR")" $RVAS
          CDB="/c/Program Files (x86)/Windows Kits/10/Debuggers/x64/cdb.exe"
          if [ -x "$CDB" ]; then
            CMDS=".reload /f"; for r in $RVAS; do CMDS="$CMDS; ln wezterm_mux_server+0x$r"; done
            "$CDB" -z "$(cygpath -w "$EXE")" -y "$(cygpath -w "$PDBDIR")" -c "$CMDS; q" || true
          else echo "cdb not present"; fi
