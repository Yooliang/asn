[package]
name = "asn"
version = "0.1.40"
description = "ASN 即時通：收發室的懷舊桌面介面"
edition = "2021"
publish = false
default-run = "asn"

[[bin]]
name = "asn"
path = "src/main.rs"

# 命令列（寄信／收信／群組／附件）：console 子系統的獨立小執行檔，cmd／PowerShell／Claude 的 Bash 都會等它結束、拿得到結束碼
[[bin]]
name = "asn-cli"
path = "src/bin/asn-cli.rs"

# 密碼小幫手（GIT_ASKPASS／SSH_ASKPASS 用）：git／ssh 要密碼時，經本機管道請正在執行的 ASN 跳窗收，密碼只印到標準輸出給呼叫它的程式。設計見 docs/design/SECRETS.md
[[bin]]
name = "asn-askpass"
path = "src/bin/asn-askpass.rs"

# sideload＝自行安裝版（官網下載的 APK）：帶手機自動更新（下載、驗 sha256、交給系統安裝）。Google Play 版不開這個旗標，程式碼與安裝權限都不編進去
[features]
sideload = []

[lib]
name = "asn_lib"
# cdylib：安卓版把它載成 libasn_lib.so（Tauri 行動版的規定）；電腦版仍用 rlib 連進 asn 執行檔
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "macros", "rt", "process", "sync", "io-util", "signal", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio-tungstenite = { version = "0.26" }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
base64 = "0.22"
getrandom = "0.3"
sha2 = "0.10"
sha1 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
png = "0.17"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = "0.4"
zeroize = "1"
tauri-plugin-dialog = "=2.8.3"

# 電腦版（Windows／Linux）專屬：系統匣、自動更新、系統內建的加密連線（OpenSSL／SChannel）。行為與手機版分開，見 docs/design/ANDROID.md
[target.'cfg(not(target_os = "android"))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-updater = "=2.14.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }

# 安卓版專屬：純 Rust 的加密連線（不用交叉編譯 OpenSSL）、開系統瀏覽器的外掛
[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
tauri-plugin-opener = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_Foundation", "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_Security_Cryptography", "Win32_UI_Shell", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_Time", "Win32_System_Pipes", "Win32_Security_Authorization"] }

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = ["Media_Control", "Foundation", "Win32_System_Com"]

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
