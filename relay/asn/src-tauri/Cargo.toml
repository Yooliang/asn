[package]
name = "asn"
version = "0.1.15"
description = "ASN 即時通：收發室的懷舊桌面介面"
edition = "2021"
publish = false

[lib]
name = "asn_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "macros", "rt", "process", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
base64 = "0.22"
getrandom = "0.3"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
png = "0.17"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = "0.4"
tauri-plugin-updater = "=2.14.0"
tauri-plugin-dialog = "=2.8.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_Foundation", "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_Security_Cryptography", "Win32_UI_Shell"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
