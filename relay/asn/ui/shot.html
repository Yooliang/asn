<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">

<title>ASN 截圖</title>
<style>

canvas{display:block;width:100vw;height:100vh}

</style>
</head>
<body>
<canvas id="cv" aria-label="截圖框選區域"></canvas>
<div id="hint" role="status">拖曳框選要截圖的區域　Esc 或按右鍵取消</div>
<script type="module" src="shot.js"></script>
</body>
