<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASN 即時通</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" class="win" v-cloak @click="avMenu = false">
  <input ref="avFile" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/bmp" hidden @change="pickAvatar">
  <i class="rz" v-for="d in RESIZE_DIRS" :key="d" :class="'rz-' + d" @mousedown.left.prevent="resizeFrom(d)"></i>
  <header class="titlebar" data-tauri-drag-region>
    <span class="t-icon"></span><span class="t-text"><span class="brand">ASN</span> 即時通</span>
    <span class="t-btns">
      <button class="tb" @click="ctl('min')" aria-label="最小化" title="最小化"><svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><rect x="2" y="8" width="8" height="2" rx=".5" fill="currentColor"/></svg></button>
      <button class="tb" @click="ctl('max')" aria-label="最大化" title="最大化"><svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><rect x="1.75" y="1.75" width="8.5" height="8.5" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="1.75" y="1.75" width="8.5" height="2.2" fill="currentColor"/></svg></button>
      <button class="tb close" @click="ctl('close')" aria-label="關閉並結束" title="關閉"><svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M2.6 2.6l6.8 6.8M9.4 2.6l-6.8 6.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    </span>
  </header>
  <div class="shell" :class="{ merged: ui.mode === 'merged' }">
  <div class="pane list-pane">
    <div class="me">
      <div class="me-av">
        <button class="dp me-dp" type="button" :class="'st-' + me.status" :style="{ '--h': 205 }" :disabled="avBusy" aria-label="點一下換大頭貼" title="點一下換大頭貼" data-tip="點一下換大頭貼" @click="avMenu = false; avFile.click()" @contextmenu.prevent="avMenu = !avMenu"><span><img :src="meAv" alt="我的大頭貼"></span></button>
        <ul class="av-menu" v-if="avMenu" role="menu" @click.stop>
          <li><button type="button" role="menuitem" @click="avMenu = false; avFile.click()">換大頭貼…</button></li>
          <li><button type="button" role="menuitem" :disabled="!selfHasUpload" @click="avMenu = false; removeAvatar()">改回自動產生</button></li>
        </ul>
      </div>
      <div class="me-info">
        <div class="me-row">
          <input class="ghost nick-input" v-model="me.nick" maxlength="40" aria-label="我的暱稱（也是對外的名字）" @change="commitNick" @keydown.enter="$event.target.blur()">
          <select class="ghost status-sel" v-model="me.status" aria-label="我的狀態">
            <option v-for="(label, key) in STATUS" :key="key" :value="key">({{ label }})</option>
          </select>
        </div>
        <input class="ghost psm-input" v-model="me.psm" maxlength="60" placeholder="&lt;輸入個人訊息&gt;" aria-label="個人訊息">
        <div class="nick-err" v-if="nickErr" role="alert">{{ nickErr }}</div>
        <div class="av-note" v-if="avMsg" role="status">{{ avMsg }}</div>
      </div>
    </div>
    <div class="body">
      <nav class="rail" role="tablist" aria-label="名單分頁">
        <button v-for="d in dev.visible" :key="d.key" class="rtab dev" :class="{ on: tab === d.key, empty: d.empty }" role="tab" :aria-selected="tab === d.key" :title="d.label" :aria-label="d.label" @click="tab = d.key">
          <img v-if="dimTab === 'device' && d.key === selfNode" src="img/logo.svg" alt="">
          <span v-else-if="d.dot" class="dot big" :class="'st-' + d.dot"></span>
          <span v-else class="mono">{{ d.short }}</span>
          <span class="red" v-if="d.unread"></span>
        </button>
        <div class="more-wrap" v-if="dev.more.length">
          <button class="rtab dev" :class="{ on: moreOn }" role="tab" :aria-selected="moreOn" title="更多" aria-label="更多" @click="moreOpen = !moreOpen">
            <span class="mono">⋯</span><span class="red" v-if="moreUnreadN"></span>
          </button>
          <ul class="more-pop" v-if="moreOpen">
            <li v-for="d in dev.more" :key="d.key"><button :class="{ on: tab === d.key, empty: d.empty }" @click="tab = d.key; moreOpen = false">{{ d.label }}<i class="red" v-if="d.unread"></i></button></li>
          </ul>
        </div>
        <span class="rail-gap"></span>
        <button v-for="t in FIXED_TABS" :key="t.key" class="rtab" :class="{ on: tab === t.key }" role="tab" :aria-selected="tab === t.key" :title="t.label" :aria-label="t.label" @click="tab = t.key">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <g v-if="t.key === 'groups'"><circle cx="8" cy="9" r="3" fill="#f0b040" stroke="#a06a10"/><circle cx="16" cy="9" r="3" fill="#6fb6f0" stroke="#1f5d9e"/><path d="M2.5 19c0-3.6 2.4-5.4 5.5-5.4s5.5 1.8 5.5 5.4zM10.5 19c0-3.6 2.4-5.4 5.5-5.4s5.5 1.8 5.5 5.4z" fill="#e8eef5" stroke="#6b7f95"/></g>
            <g v-else-if="t.key === 'notices'"><path d="M12 3c-3.6 0-5.5 2.6-5.5 6v3.6L4.5 16h15l-2-3.4V9c0-3.4-1.9-6-5.5-6z" fill="#f4c542" stroke="#a37a0a"/><path d="M10 18.5a2 2 0 0 0 4 0z" fill="#d49a10" stroke="#a37a0a"/></g>
            <g v-else><path d="M12 2.8v3M12 18.2v3M2.8 12h3M18.2 12h3M5.5 5.5l2.1 2.1M16.4 16.4l2.1 2.1M18.5 5.5l-2.1 2.1M7.6 16.4l-2.1 2.1" stroke="#4a5d73" stroke-width="2.4" stroke-linecap="round"/><circle cx="12" cy="12" r="5.6" fill="#dfe8f2" stroke="#4a5d73" stroke-width="2"/><circle cx="12" cy="12" r="2" fill="#fff" stroke="#4a5d73"/></g>
          </svg>
        </button>
      </nav>
      <div class="content" role="tabpanel">
        <template v-if="isDevice">
          <div class="search"><input v-model="query" placeholder="搜尋聯絡人..." aria-label="搜尋聯絡人"></div>
          <div class="list">
            <div v-for="g in shown" :key="g.key">
              <button class="g-head" @click="collapsed[g.key] = !collapsed[g.key]" :aria-expanded="!collapsed[g.key]">
                <span class="box">{{ collapsed[g.key] ? '+' : '−' }}</span>{{ groupHeading(g) }}
              </button>
              <ul v-show="!collapsed[g.key]">
                <li v-for="c in g.items" :key="c.id">
                  <button class="buddy" :class="{ offline: c.status === 'offline' }" @click="openChat(c.id)">
                    <span class="dp xs" :class="'st-' + c.status"><span><img :src="avOf(c)" alt=""></span></span>
                    <span class="b-text">
                      <span class="b-line"><span class="b-nick" v-html="emo(c.nick)"></span><span class="b-st" v-if="statusNote(c.status)">{{ statusNote(c.status) }}</span></span>
                      <span class="b-psm" v-if="c.psm" v-html="emo(c.psm)"></span>
                    </span>
                    <span class="unread" v-if="c.unread">{{ c.unread }}</span>
                  </button>
                </li>
              </ul>
            </div>
            <div class="empty-list" v-if="!shown.length">{{ emptyText }}</div>
          </div>
        </template>
        <div class="list" v-else-if="tab === 'groups'">
          <ul>
            <li v-for="r in rooms" :key="r.id" class="room">
              <span class="room-ic"></span>
              <span class="b-text"><span class="b-line"><span class="b-nick" v-html="emo(r.name)"></span><span class="b-st">({{ r.count }} 人)</span></span><span class="b-psm" v-if="r.last" v-html="emo(r.last)"></span></span>
            </li>
          </ul>
          <div class="empty-list" v-if="!rooms.length">{{ roomsErr ? '讀不到群組。' : '目前不在任何群組。' }}</div>
        </div>
        <div class="list" v-else-if="tab === 'notices'">
          <ul>
            <li v-for="(n, i) in notices" :key="i">
              <button class="buddy" @click="openChat(n.cid)">
                <span class="dp xs st-online"><span><img :src="avById(n.cid)" alt=""></span></span>
                <span class="b-text"><span class="b-line"><span class="b-nick" v-html="emo(n.who)"></span><span class="b-st">{{ fmtTime(n.t) }}</span></span><span class="b-psm" v-html="emo(n.line)"></span></span>
              </button>
            </li>
          </ul>
          <div class="empty-list" v-if="!notices.length">還沒有通知。</div>
        </div>
        <div class="list settings" v-else>
          <div class="av-set">
            <b>大頭貼</b>
            <div class="av-row">
              <div class="dp" :class="'st-' + me.status"><span><img :src="meAv" alt="我的大頭貼"></span></div>
              <div class="av-btns">
                <button class="aero-btn" type="button" @click="avFile.click()" :disabled="avBusy">選擇圖片…</button>
                <button class="aero-btn" type="button" @click="removeAvatar" :disabled="avBusy || !selfHasUpload">移除，改回自動產生</button>
              </div>
            </div>
            <small role="status">{{ avMsg || (selfHasUpload ? '目前用的是這台設備上傳的大頭貼。' : '目前用的是自動產生的大頭貼。') }}</small>
          </div>
          <label>音效
            <select class="set-sel" :value="soundChoice(soundOn)" @change="soundOn = soundFromChoice($event.target.value)" aria-label="音效"><option v-for="c in SOUND_CHOICES" :key="c" :value="c">{{ SOUND_LABEL[c] }}</option></select>
          </label>
          <label>視窗外框
            <select class="set-sel" :value="frame" @change="setFrame($event.target.value)" aria-label="視窗外框"><option v-for="f in FRAMES" :key="f" :value="f">{{ FRAME_LABEL[f] }}</option></select>
          </label>
          <label>視窗模式
            <select class="set-sel" :value="ui.mode" @change="setMode($event.target.value)" aria-label="視窗模式"><option v-for="m in MODES" :key="m" :value="m">{{ MODE_LABEL[m] }}</option></select>
          </label>
          <label>頭像模式
            <select class="set-sel" v-model="ui.dpMode" aria-label="頭像模式"><option v-for="m in DP_MODES" :key="m" :value="m">{{ DP_LABEL[m] }}</option></select>
          </label>
          <label>工具列位置
            <select class="set-sel" v-model="ui.toolbar" aria-label="工具列位置"><option v-for="b in TOOLBARS" :key="b" :value="b">{{ TOOLBAR_LABEL[b] }}</option></select>
          </label>
          <label>文字底色
            <select class="set-sel" v-model="ui.bubble" aria-label="文字底色"><option v-for="b in BUBBLES" :key="b" :value="b">{{ BUBBLE_LABEL[b] }}</option></select>
          </label>
          <label>分頁依
            <select class="set-sel" :value="dims.tabDim" @change="setTabDim($event.target.value)" aria-label="分頁依"><option v-for="d in DIMS" :key="d.key" :value="d.key">{{ d.label }}</option></select>
          </label>
          <label>分組依
            <select class="set-sel" v-model="dims.groupDim" aria-label="分組依"><option v-for="d in groupOptions(dims.tabDim)" :key="d.key" :value="d.key">{{ d.label }}</option></select>
          </label>
        </div>
      </div>
    </div>
    <div class="c-foot">
      <span class="conn"><span class="dot" :class="conn === 'on' ? 'st-online' : conn === 'off' ? 'st-busy' : 'st-away'"></span>{{ CONN_LABEL[conn] }}</span>
    </div>
    <div class="ad-wrap">
      <button v-for="(a, i) in ADS" :key="a.key" v-show="i === adI" class="ad" :class="{ link: a.url }" :style="{ '--h': a.hue }" :disabled="!a.url" :aria-label="a.title + '：' + a.sub" @click="openAd(a)">
        <span class="ad-new" v-if="a.badge">{{ a.badge }}</span>
        <span class="ad-art"><i></i><i></i><i></i></span>
        <span class="ad-tx"><b>{{ a.title }}</b><small>{{ a.sub }}</small><em v-if="a.cta">{{ a.cta }} ›</em></span>
      </button>
      <span class="ad-dots"><i v-for="(a, i) in ADS" :key="a.key" :class="{ on: i === adI }"></i></span>
    </div>
  </div>
  <section class="chat-area" v-if="ui.mode === 'merged'" aria-label="對話">
    <div class="tabbar" role="tablist" aria-label="開著的對話">
      <div class="ctab on home" v-if="!mergedTabs.length" role="tab" aria-selected="true"><img src="img/logo.svg" alt="" width="14" height="14"><span class="ctab-name">開始</span></div>
      <div v-for="t in mergedTabs" :key="t.id" class="ctab" :class="{ on: t.id === ui.active }" role="tab" :aria-selected="t.id === ui.active" @click="activateTab(t.id)" @auxclick.middle.prevent="closeChatTab(t.id)">
        <span class="dot" :class="'st-' + t.status"></span>
        <span class="ctab-name">{{ plain(t.nick) }}</span>
        <span class="unread" v-if="t.unread">{{ t.unread }}</span>
        <button class="ctab-x" type="button" @click.stop="closeChatTab(t.id)" :aria-label="'關閉 ' + plain(t.nick) + ' 的對話'">✕</button>
      </div>
    </div>
    <div class="chat-stack">
      <chat-pane v-for="t in mergedTabs" :key="t.id" v-show="t.id === ui.active" :friend="t" :me="me" :log="logs[t.id] || []" :friend-av="avOf(t)" :me-av="meAv" :dp-mode="ui.dpMode" :bubble="ui.bubble" :toolbar="ui.toolbar" :dp-collapsed="ui.collapsed" :active="t.id === ui.active"
        @send="text => sendTo(t.id, text)" @nudge="nudgeTo(t.id)" @toggle-dp="toggleDp"></chat-pane>
      <div class="pane" v-if="!mergedTabs.length"><div class="empty-chat">從左邊的名單點一位好友，開始聊天。</div></div>
    </div>
  </section>
  </div>
</div>
<script src="vendor/vue.global.prod.js"></script>
<script type="module" src="list.js"></script>
</body>
</html>
