<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASN 對話</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" class="win" v-cloak>
  <i class="rz" v-for="d in RESIZE_DIRS" :key="d" :class="'rz-' + d" @mousedown.left.prevent="resizeFrom(d)"></i>
  <header class="titlebar" data-tauri-drag-region>
    <span class="t-icon"></span>
    <span class="t-text">{{ f ? plain(f.nick) + ' - 對話' : '對話' }}</span>
    <span class="t-btns">
      <button class="tb" @click="ctl('min')" aria-label="最小化" title="最小化"><svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><rect x="2" y="8" width="8" height="2" rx=".5" fill="currentColor"/></svg></button>
      <button class="tb" @click="ctl('max')" aria-label="最大化" title="最大化"><svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><rect x="1.75" y="1.75" width="8.5" height="8.5" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="1.75" y="1.75" width="8.5" height="2.2" fill="currentColor"/></svg></button>
      <button class="tb close" @click="ctl('close')" aria-label="關閉對話" title="關閉"><svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M2.6 2.6l6.8 6.8M9.4 2.6l-6.8 6.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    </span>
  </header>
  <chat-pane :friend="f" :me="me" :log="log" :friend-av="friendAv" :me-av="meAv" :dp-mode="look.dpMode" :bubble="look.bubble" :toolbar="look.toolbar" :dp-collapsed="look.collapsed" :photo-api="photoApi" :shot-api="shotApi" :voice="voice" :agent-api="transport" :self-node="selfNode" @send="send" @nudge="nudge" @attach="attach" @toggle-dp="toggleDp" @call-state="callState"></chat-pane>
</div>
<script src="vendor/vue.global.prod.js"></script>
<script type="module" src="chat.js"></script>
</body>
</html>
