<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASN 對話</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" class="win" v-cloak>
  <header class="titlebar" data-tauri-drag-region>
    <span class="t-icon"></span>
    <span class="t-text">{{ f ? plain(f.nick) + ' - 對話' : '對話' }}</span>
    <span class="t-btns">
      <button class="tb" @click="ctl('min')" aria-label="最小化">_</button>
      <button class="tb" @click="ctl('max')" aria-label="最大化">□</button>
      <button class="tb close" @click="ctl('close')" aria-label="關閉對話">✕</button>
    </span>
  </header>
  <chat-pane :friend="f" :me="me" :log="log" :dp-mode="look.dpMode" :bubble="look.bubble" :toolbar="look.toolbar" :dp-collapsed="look.collapsed" @send="send" @nudge="nudge" @toggle-dp="toggleDp"></chat-pane>
</div>
<script src="vendor/vue.global.prod.js"></script>
<script type="module" src="chat.js"></script>
</body>
</html>
