<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#8fbfec">
<title>ASN</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="mobile.css">
<link rel="stylesheet" href="group.css">
</head>
<body class="m-body">
<!-- 開機畫面：放在 #app 外面，Vue 掛上去之前就看得到，掛上後由 m.js 移除（#app 在掛上前整個藏起來，不會露出樣板原文） -->
<div id="splash" class="m-center"><img class="m-logo" src="img/logo.svg" alt=""><p>啟動中…</p></div>
<div id="app" class="m" v-cloak>
  <!-- 啟動中、無法啟動 -->
  <section class="m-center" v-if="screen === 'fatal'"><img class="m-logo" src="img/logo.svg" alt=""><p role="alert">ASN 無法啟動：{{ fatal }}</p></section>

  <!-- 首次登入引導：帳號名稱（已有就跳過）＋這支手機的名稱 -->
  <section class="m-login" v-else-if="screen === 'onboard'">
    <div class="m-login-card">
      <div class="login-avatar is-logo"><img src="img/logo.svg" alt=""></div>
      <h1 class="login-h">{{ ONBOARD_TEXT.title }}</h1>
      <onboard-card :steps="onboard.steps" :device-default="info.window_name" :api="onboardApi" :mobile="true" @done="finishOnboard"></onboard-card>
    </div>
  </section>

  <!-- 登入 -->
  <section class="m-login" v-else-if="screen === 'login'">
    <div class="m-login-card">
      <div class="login-avatar is-logo"><img src="img/logo.svg" alt=""></div>
      <h1 class="login-h">歡迎使用 ASN</h1>
      <p class="login-sub">登入後，這支手機會自動出現在你的名單裡。</p>
      <button v-for="p in PROVIDERS" :key="p.key" class="m-btn m-btn-big" type="button" :disabled="!canStart(login.phase)" @click="startLogin(p.key)">{{ p.label }}</button>
      <p class="login-note" v-if="loginNote" role="status">{{ loginNote }}</p>
      <button class="m-btn" type="button" v-if="login.phase === 'waiting'" @click="cancelLogin">取消</button>
      <p class="login-err" v-if="login.phase === 'error'" role="alert">{{ login.error }}</p>
    </div>
  </section>

  <!-- 登入後 -->
  <template v-else>
    <div class="m-banner" v-if="banner" role="status" @click="openBanner">
      <span class="dp xs" :class="'st-' + banner.status"><span><img :src="avById(banner.id)" alt=""></span></span>
      <span class="m-banner-tx" :class="{ wrap: banner.handover }"><b v-html="emo(banner.nick)"></b><small>{{ banner.line }}</small></span>
      <button class="m-banner-act" type="button" v-if="banner.handover" @click.stop="bannerHandover">接班換手</button>
    </div>

    <!-- 三個大分頁：夥伴／對話／設置。左右滑動切換（跟手，放開吸附到最近的分頁），也可以點上方分頁；下拉重整只在夥伴與對話兩頁 -->
    <section class="m-page">
      <nav class="m-tabs" :class="{ dragging: sw.dragging }" role="tablist" aria-label="大分頁">
        <i class="m-ind" :style="{ transform: 'translateX(' + indicator * 100 + '%)' }" aria-hidden="true"></i>
        <button v-for="t in TABS" :key="t" type="button" role="tab" :class="{ on: nav.tab === t }" :aria-selected="nav.tab === t" @click="goTab(t)"><span>{{ tabLabel(t) }}</span><i class="red" v-if="t === 'chats' && unreadTotal"></i></button>
      </nav>
      <div class="m-upd" v-if="upd.enabled && upd.phase !== 'idle'" role="status" :class="{ failed: upd.phase === 'failed' }">
        <span class="m-upd-tx">{{ updText }}</span>
        <button class="m-btn m-upd-btn" type="button" v-if="upd.phase !== 'downloading'" @click="startUpdate">{{ updButton }}</button>
        <span class="m-upd-hint" v-if="upd.hint">{{ upd.hint }}</span>
      </div>
      <div class="m-pager-wrap" @touchstart.passive="swipeStart($event, 'pager')" @touchmove="swipeMove" @touchend="swipeEnd" @touchcancel="swipeEnd">
        <div class="m-pager" :class="{ dragging: sw.dragging }" :style="pagerStyle">

          <!-- 夥伴：依設備分組，廠商小徽章、最後一句話 -->
          <section class="m-pg" aria-label="夥伴">
            <header class="m-head">
              <button class="m-me" type="button" aria-label="設置" @click="goTab('me')"><img class="m-pic" :class="'st-' + me.status" :src="meAv" alt="" width="44" height="44"></button>
              <div class="m-head-tx">
                <div class="m-title">{{ myName }}</div>
                <div class="m-conn"><span class="dot" :class="conn === 'on' ? 'st-online' : conn === 'off' ? 'st-busy' : 'st-away'"></span><span class="m-conn-tx">{{ conn === 'on' ? STATUS[me.status] : CONN_LABEL[conn] }}<template v-if="conn === 'on' && me.nick">・{{ me.nick }}</template><template v-if="conn === 'on' && me.psm"> · {{ me.psm }}</template></span></div>
              </div>
              <div class="m-plus-wrap">
                <button class="m-icon-btn" type="button" aria-label="新增" aria-haspopup="menu" :aria-expanded="plusOpen" @click="plusOpen = !plusOpen"><svg class="m-ic" viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path d="M12 4.5v15M4.5 12h15" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></button>
                <div class="m-plus-back" v-if="plusOpen" @click="plusOpen = false"></div>
                <div class="m-plus-menu" v-if="plusOpen" role="menu">
                  <button type="button" role="menuitem" @click="pickPlus('create')">建立群組</button>
                  <button type="button" role="menuitem" @click="pickPlus('join')">加入群組／貼邀請碼</button>
                  <button type="button" role="menuitem" @click="pickPlus('launch')">開新夥伴</button>
                </div>
              </div>
            </header>
            <ptr-zone :ptr="pf.ptr"></ptr-zone>
            <div class="m-scroll" :ref="el => (pf.ptr.el = el)" @touchstart.passive="pf.start" @touchmove="pf.move" @touchend="pf.end" @touchcancel="pf.end">
              <p class="m-archive-note" v-if="archiveNote" role="status">{{ archiveNote }}</p>
              <div class="m-search"><input v-model="query" type="search" placeholder="搜尋聯絡人…" aria-label="搜尋聯絡人" enterkeyhint="search"></div>
              <!-- 最近有活動：24 小時內有往來的夥伴與群組（最多 8 個、新到舊）；下方設備分組照常列出同一位。沒有近期活動就不顯示 -->
              <div class="m-group m-recent" v-if="recentRows.length">
                <button class="m-ghead" type="button" :aria-expanded="!collapsed[RECENT_GROUP_KEY]" @click="collapsed[RECENT_GROUP_KEY] = !collapsed[RECENT_GROUP_KEY]">
                  <span class="m-caret" :class="{ open: !collapsed[RECENT_GROUP_KEY] }">▸</span>{{ RECENT_GROUP_LABEL }}（{{ recentRows.length }}）
                </button>
                <ul v-show="!collapsed[RECENT_GROUP_KEY]">
                  <li v-for="x in recentRows" :key="x.id">
                    <button class="m-buddy" :class="{ offline: x.kind === 'friend' && x.friend.status === 'offline' }" type="button" @click="x.kind === 'room' ? openRoom(x.room.chatId) : openChat(x.id)">
                      <template v-if="x.kind === 'friend'">
                        <span class="m-av-wrap">
                          <asn-avatar size="sm" :src="avOf(x.friend)" :friend="x.friend" :status="x.friend.status" :off="false"></asn-avatar>
                        </span>
                        <span class="b-text">
                          <span class="b-line"><span class="b-nick" v-html="emo(x.friend.nick)"></span><span class="b-st" v-if="statusNote(x.friend.status)">{{ statusNote(x.friend.status) }}</span></span>
                          <span class="b-last" v-if="lastOf(x.id)">{{ lastOf(x.id) }}</span>
                        </span>
                        <span class="unread" v-if="x.friend.unread">{{ x.friend.unread }}</span>
                      </template>
                      <template v-else>
                        <span class="m-av-wrap"><span class="m-room-ic" aria-hidden="true"><svg viewBox="0 0 24 24" width="24" height="24"><circle cx="9" cy="9" r="3.2" fill="currentColor"/><circle cx="16.5" cy="10" r="2.6" fill="currentColor" opacity=".7"/><path d="M3.5 19c.4-3.2 2.7-5 5.5-5s5.1 1.8 5.5 5zM14.6 14.4c.6-.2 1.3-.3 1.9-.3 2.3 0 4 1.5 4.3 4.9h-4.4c-.1-1.9-.7-3.5-1.8-4.6z" fill="currentColor"/></svg></span></span>
                        <span class="b-text">
                          <span class="b-line"><span class="b-nick" v-html="emo(x.room.name)"></span><span class="b-st">{{ x.room.count }} 位成員</span></span>
                          <span class="b-last" v-if="x.room.last">{{ x.room.last }}</span>
                        </span>
                        <span class="unread" v-if="x.room.unread">{{ x.room.unread }}</span>
                      </template>
                    </button>
                  </li>
                </ul>
              </div>
              <!-- 群組對話：我參加的群組，放在各設備分組之前（建立／加入在右上角「＋」選單）；沒有群組就整組不顯示；點進去在對話分頁看訊息、發言 -->
              <div class="m-group m-rooms" v-if="roomRows.length">
                <button class="m-ghead" type="button" :aria-expanded="!collapsed[ROOM_GROUP_KEY]" @click="collapsed[ROOM_GROUP_KEY] = !collapsed[ROOM_GROUP_KEY]">
                  <span class="m-caret" :class="{ open: !collapsed[ROOM_GROUP_KEY] }">▸</span>{{ ROOM_GROUP_LABEL }}（{{ roomRows.length }}）
                </button>
                <ul v-show="!collapsed[ROOM_GROUP_KEY]">
                  <li v-for="r in roomRows" :key="r.id">
                    <button class="m-buddy" type="button" @click="openRoom(r.chatId)">
                      <span class="m-av-wrap"><span class="m-room-ic" aria-hidden="true"><svg viewBox="0 0 24 24" width="24" height="24"><circle cx="9" cy="9" r="3.2" fill="currentColor"/><circle cx="16.5" cy="10" r="2.6" fill="currentColor" opacity=".7"/><path d="M3.5 19c.4-3.2 2.7-5 5.5-5s5.1 1.8 5.5 5zM14.6 14.4c.6-.2 1.3-.3 1.9-.3 2.3 0 4 1.5 4.3 4.9h-4.4c-.1-1.9-.7-3.5-1.8-4.6z" fill="currentColor"/></svg></span></span>
                      <span class="b-text">
                        <span class="b-line"><span class="b-nick" v-html="emo(r.name)"></span><span class="b-st">{{ r.count }} 位成員</span></span>
                        <span class="b-last" v-if="r.last">{{ r.last }}</span>
                      </span>
                      <span class="unread" v-if="r.unread">{{ r.unread }}</span>
                    </button>
                  </li>
                </ul>
              </div>
              <div v-for="g in groups" :key="g.key" class="m-group">
                <div class="m-ghead-row">
                  <button class="m-ghead" type="button" :aria-expanded="!collapsed[g.key]" @click="collapsed[g.key] = !collapsed[g.key]">
                    <span class="m-caret" :class="{ open: !collapsed[g.key] }">▸</span>{{ groupHeading(g) }}
                  </button>
                  <button class="m-ghead-act" type="button" v-if="acctKeys.has(g.key)" :aria-label="ACCT_TEXT.button + '：' + g.label" @click="openAcct(g)">{{ ACCT_TEXT.button }}</button>
                </div>
                <ul v-show="!collapsed[g.key]">
                  <li v-for="c in g.items" :key="c.id" :class="{ 'm-archived-row': g.kind === 'archived' }">
                    <button class="m-buddy" :class="{ offline: c.status === 'offline' }" type="button" @click="openChat(c.id)">
                      <span class="m-av-wrap">
                        <asn-avatar size="sm" :src="avOf(c)" :friend="c" :status="c.status" :off="false"></asn-avatar>
                      </span>
                      <span class="b-text">
                        <span class="b-line"><span class="b-nick" v-html="emo(c.nick)"></span><span class="b-ctx" :class="{ danger: contextLabel(c).danger }" v-if="contextLabel(c)">{{ contextLabel(c).text }}</span><span class="b-st" v-if="statusNote(c.status)">{{ statusNote(c.status) }}</span></span>
                        <span class="b-psm" v-if="c.psm" v-html="emo(c.psm)"></span>
                        <span class="b-last" v-if="lastOf(c.id)">{{ lastOf(c.id) }}</span>
                      </span>
                      <span class="unread" v-if="c.unread">{{ c.unread }}</span>
                    </button>
                    <button class="m-unarchive" type="button" v-if="g.kind === 'archived'" :aria-label="'取消封存 ' + c.nick" @click="setArchived(c, false)">取消封存</button>
                  </li>
                </ul>
              </div>
              <div class="empty-list" v-if="!groups.length">{{ emptyText }}</div>
            </div>
          </section>

          <!-- 對話：最後使用的那一位的對話內容（從夥伴分頁點一位就成為最後使用）；右上角「⋯」管理這位的視窗 -->
          <section class="m-pg m-chat" :class="{ shake, 'is-room': chatFriend && chatFriend.room }" :aria-label="tabLabel('chats')">
            <div class="m-keep" :hidden="nav.sheet === 'acct'">
            <header class="m-head m-chathead" :class="{ 'is-busy': chatFriend && headTone(chatFriend.status, chatFriend) === 'busy', 'is-offline': chatFriend && !chatFriend.room && headTone(chatFriend.status, chatFriend) === 'offline' }">
              <template v-if="chatFriend">
                <img class="m-pic" :class="'st-' + chatFriend.status" :src="avOf(chatFriend)" alt="" width="44" height="44">
                <div class="m-head-tx">
                  <div class="m-title" v-html="emo(chatFriend.nick)"></div>
                  <div class="m-conn" v-if="chatFriend.room">{{ chatFriend.psm }}</div>
                  <div class="m-conn" v-else>{{ STATUS[chatFriend.status] }}<template v-if="chatFriend.psm"> · <span v-html="emo(chatFriend.psm)"></span></template></div>
                </div>
                <button class="m-icon-btn" type="button" aria-label="更多操作" v-if="opsItems.length || groupItems.length" @click="openOps"><svg class="m-ic" viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><circle cx="5" cy="12" r="2.4" fill="currentColor"/><circle cx="12" cy="12" r="2.4" fill="currentColor"/><circle cx="19" cy="12" r="2.4" fill="currentColor"/></svg></button>
              </template>
              <template v-else>
                <button class="m-me" type="button" aria-label="設置" @click="goTab('me')"><img class="m-pic" :class="'st-' + me.status" :src="meAv" alt="" width="44" height="44"></button>
                <div class="m-head-tx"><div class="m-title">對話</div></div>
              </template>
            </header>
            <div class="m-ops-run" v-if="opsBanner" :class="'is-' + opsBanner.phase" role="status">
              <p class="m-ops-run-tx">{{ opsBanner.text }}</p>
              <ol class="m-ops-steps" v-if="opsBanner.steps.length"><li v-for="s in opsBanner.steps" :key="s.key" :class="'is-' + s.state"><b aria-hidden="true">{{ s.mark }}</b>{{ s.text }}</li></ol>
              <p class="m-ops-run-more" v-for="l in opsBanner.extra" :key="l">{{ l }}</p>
              <button class="m-btn m-ops-run-btn" type="button" v-if="opsBanner.done" @click="dismissRun">知道了</button>
            </div>
            <p class="m-err m-room-note" v-if="roomNote && chatFriend && chatFriend.room" role="alert">{{ roomNote }}</p>
            <chat-pane v-if="chatFriend" :friend="chatFriend" :me="meForChat" :log="chatLog" :friend-av="avOf(chatFriend)" :me-av="meAv"
              dp-mode="inline" bubble="auto" toolbar="bottom" win-mode="merged" :hide-busy-warn="true" :active="false" :enter-sends="false" :photo-api="photoApi" :call-api="callApi" :dict-api="dictApi" :hint-names="friends" @call-state="onCallState" :load-older="loadOlder"
              @send="(text, opts) => sendTo(chatFriend.id, text, opts)" @nudge="nudgeTo(chatFriend.id)" @attach="(p, cap) => sendAttachTo(chatFriend.id, p, cap)"
              :room-cards="chatCards" @group-decide="(cid, ok) => decideCard(chatFriend.id, cid, ok)"></chat-pane>
            <div class="m-scroll" v-else><div class="empty-list">{{ chatEmptyText }}</div></div>
            </div>
            <!-- 替電腦切換 Claude 帳號：佔用第二個分頁（標籤暫時改成「選項」），原本的對話內容只是藏起來、不卸載；選帳號 → 確認 → 送出並等對方電腦回報 -->
            <template v-if="nav.sheet === 'acct'">
              <header class="m-head m-chathead">
                <button class="m-icon-btn" type="button" aria-label="返回" @click="acctHeaderBack"><svg class="m-ic" viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path d="M15 4.5L7.5 12 15 19.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
                <div class="m-head-tx"><div class="m-title">{{ ACCT_PAGE_TITLE }}</div></div>
              </header>
          <div class="m-sheet-body m-dv">
            <template v-if="acctSw.phase === 'pick' && !acctCur">
              <p class="m-note" v-if="!acctDevs.length">{{ DEVICE_TEXT.empty }}</p>
              <ul class="m-dv-list" aria-label="設備" v-else>
                <li v-for="d in acctDevs" :key="d.key" :data-dev="d.key" class="m-dv-row" :class="{ hid: d.hidden, off: !d.online, dragging: acctDrag.key === d.key, 'drop-before': acctDrag.over === d.key && !acctDrag.after, 'drop-after': acctDrag.over === d.key && acctDrag.after }">
                  <button type="button" class="m-dv-grip" v-if="!d.self" :aria-label="'拖曳調整 ' + d.label + ' 的順序，或按上下鍵'" @pointerdown="gripDown(d.key, $event)" @pointermove="gripMove" @pointerup="gripUp" @pointercancel="gripUp" @keydown="gripKey(d.key, $event)"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M8 6h.01M16 6h.01M8 12h.01M16 12h.01M8 18h.01M16 18h.01" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/></svg></button>
                  <span class="m-dv-grip-gap" v-else aria-hidden="true"></span>
                  <button type="button" class="m-dv-go" @click="openAcctDevice(d.key)">
                    <span class="m-dv-dot" :class="d.online ? 'on' : 'off'" aria-hidden="true"></span>
                    <span class="m-dv-rn"><b>{{ d.label }}</b><span class="m-dv-rs">{{ d.kind }} · {{ d.onlineText }}<template v-if="d.self"> · 這支手機</template></span></span>
                    <span class="m-dv-tag hid" v-if="d.hidden">{{ DEVICE_TEXT.hiddenTag }}</span>
                    <span class="m-dv-chev" aria-hidden="true">&rsaquo;</span>
                  </button>
                </li>
              </ul>
              <div class="m-dv-removed" v-if="acctRemoved.length">
                <button type="button" class="m-dv-removed-link" :aria-expanded="acctSw.removedOpen ? 'true' : 'false'" @click="acctSw.removedOpen = !acctSw.removedOpen">{{ DEVICE_TEXT.removedLink(acctRemoved.length) }}</button>
                <ul v-if="acctSw.removedOpen">
                  <li v-for="d in acctRemoved" :key="d.key"><span>{{ d.label }}</span><button type="button" class="m-dv-refresh" @click="acctRestore(d.key)">{{ DEVICE_TEXT.restore }}</button></li>
                </ul>
              </div>
              <button type="button" class="m-btn m-ops-cancel" @click="back">{{ ACCT_TEXT.close }}</button>
            </template>
            <template v-else-if="acctSw.phase === 'pick'">
              <button type="button" class="m-dv-back" @click="acctBackToList">{{ DEVICE_TEXT.back }}</button>
              <section class="m-dv-dev" role="region" :aria-label="acctCur.label">
                <div class="m-dv-dh">
                  <h3 class="m-dv-name">{{ acctCur.label }}</h3>
                  <span class="m-dv-tag">{{ acctCur.kind }}</span>
                  <span class="m-dv-tag" :class="acctCur.online ? 'on' : 'off'">{{ acctCur.onlineText }}</span>
                  <span class="m-dv-tag me" v-if="acctCur.self">這支手機</span>
                  <span class="m-dv-tag hid" v-if="acctCur.hidden">{{ DEVICE_TEXT.hiddenTag }}</span>
                </div>
                <div class="m-dv-hid-act" v-if="acctCanRemove">
                  <button type="button" class="m-dv-refresh" @click="acctShowBack">{{ DEVICE_TEXT.showBack }}</button>
                  <button type="button" class="m-dv-refresh m-dv-danger" @click="acctAskRemove">{{ DEVICE_TEXT.remove }}</button>
                </div>
                <p class="m-fine" v-if="acctCur.reportedText">{{ acctCur.reportedText }}</p>
                <p class="m-err" v-if="acctRep && acctRep.msg" role="alert">{{ acctRep.msg }}</p>
                <div class="m-dv-body" :class="{ off: !acctCur.online }">
                  <div class="m-dv-empty" v-if="!acctCur.vendors.length"><span>{{ acctRep && acctRep.loading ? '讀取中…' : (acctCur.empty || '這台設備還沒有回報任何廠商') }}</span></div>
                  <ul class="m-dv-vendors" v-else>
                    <li class="m-dv-vendor" :class="'v-' + v.key" v-for="v in acctCur.vendors" :key="v.key">
                      <header class="m-dv-vh"><span class="m-dv-vi" aria-hidden="true" v-html="vendorIconSvg(v.key)"></span><b>{{ v.label }}</b></header>
                      <div class="m-dv-vb">
                        <ul class="m-dv-accts" v-if="v.accounts.length">
                          <li class="m-dv-acct" :class="{ cur: a.current }" v-for="a in v.accounts" :key="a.email">
                            <span class="m-dv-mail">{{ a.email }}</span>
                            <span class="m-dv-side">
                              <span class="m-dv-plan" v-if="a.plan">{{ a.plan }}</span>
                              <span class="m-dv-cur" v-if="a.current">使用中</span>
                              <button type="button" class="m-dv-sw" v-else-if="v.key === 'claude' && (v.switchable || v.switchHint)" :disabled="!v.switchable" @click="startAcctSwitch(a.email)">切換</button>
                            </span>
                            <span class="m-dv-quota" :class="{ stale: a.quota.stale, 'quota-out': a.quota.exhausted }" v-if="a.quota">
                              <span>{{ a.quota.text }}</span>
                              <span v-if="a.quota.resetText">・{{ a.quota.resetText }}</span>
                              <span v-if="a.quota.meta">（{{ a.quota.meta }}）</span>
                            </span>
                          </li>
                        </ul>
                        <div class="m-dv-none" v-else>{{ acctRep && acctRep.loading ? '讀取中…' : '目前未回報任何帳號' }}</div>
                        <small class="m-fine" v-if="v.switchHint">{{ v.switchHint }}</small>
                        <small class="m-fine" v-if="v.key === 'claude' && v.accounts.length && v.switchable">{{ ACCT_TEXT.quotaNote }}</small>
                      </div>
                    </li>
                  </ul>
                </div>
              </section>
              <button type="button" class="m-btn m-ops-cancel" @click="back">{{ ACCT_TEXT.close }}</button>
            </template>
            <template v-else-if="acctSw.phase === 'rm'">
              <p class="m-ops-lead" role="alert">{{ acctRemoveText }}</p>
              <button type="button" class="m-btn m-btn-big m-dv-danger" @click="acctRemoveNow">{{ DEVICE_TEXT.removeYes }}</button>
              <button type="button" class="m-btn m-ops-cancel" @click="acctBackToPick">{{ DEVICE_TEXT.cancel }}</button>
            </template>
            <template v-else-if="acctSw.phase === 'confirm'">
              <p class="m-ops-lead">{{ acctConfirm.lead }}</p>
              <ul class="m-ops-points"><li v-for="p in acctConfirm.points" :key="p">{{ p }}</li></ul>
              <button type="button" class="m-btn m-btn-big" @click="submitAcct">{{ ACCT_TEXT.confirmOk }}</button>
              <button type="button" class="m-btn m-ops-cancel" @click="acctBackToPick">{{ ACCT_TEXT.back }}</button>
            </template>
            <template v-else>
              <p class="m-prog" :class="acctSw.view ? 'is-' + acctSw.view.phase : ''" role="status">{{ acctSw.view ? acctSw.view.text : '' }}</p>
              <div class="m-bar" v-if="acctSw.view && !acctSw.view.done" aria-hidden="true"><i></i></div>
              <button type="button" class="m-btn m-ops-cancel" @click="back">{{ acctSw.view && acctSw.view.done ? ACCT_TEXT.close : ACCT_TEXT.later }}</button>
            </template>
          </div>
            </template>
          </section>

          <!-- 設置 -->
          <section class="m-pg" aria-label="設置">
            <header class="m-head">
              <button class="m-me" type="button" aria-label="設置" @click="goTab('me')"><img class="m-pic" :class="'st-' + me.status" :src="meAv" alt="" width="44" height="44"></button>
              <div class="m-head-tx"><div class="m-title">設置</div></div>
            </header>
            <div class="m-scroll m-meview">
              <div class="m-card m-form m-set-list">
                <ul class="m-guide-list">
                  <li v-for="r in settingRows" :key="r.key">
                    <button class="m-row-btn" type="button" @click="openSetting(r.key)"><svg class="m-row-ic" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path :d="r.icon" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="m-row-tx"><b>{{ r.title }}</b><small>{{ r.summary }}</small></span><span class="m-caret" aria-hidden="true">▸</span></button>
                  </li>
                </ul>
              </div>
              <div class="m-card m-form m-guide-entry">
                <button class="m-row-btn" type="button" @click="openGuides"><span class="m-row-tx"><b>{{ GUIDE_ENTRY_LABEL }}</b><small>{{ GUIDE_ENTRY_SUB }}</small></span><span class="m-caret" aria-hidden="true">▸</span></button>
              </div>
              <div class="m-logout">
                <button class="m-btn m-danger" type="button" :disabled="loggingOut" @click="doLogout">登出</button>
              </div>
            </div>
          </section>
        </div>
      </div>

    </section>

    <!-- 設置的某一項：滿版的獨立一頁（左上返回回分類列表） -->
    <section class="m-sheet m-set" v-if="nav.sheet === 'setting'" role="dialog" aria-modal="true" :aria-label="settingTitle">
      <header class="m-head m-chathead">
        <button class="m-icon-btn" type="button" aria-label="返回" @click="back"><svg class="m-ic" viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path d="M15 4.5L7.5 12 15 19.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <div class="m-head-tx"><div class="m-title">{{ settingTitle }}</div></div>
      </header>
      <div class="m-sheet-body m-set-detail">
        <template v-if="settingCat === 'me'">
              <input ref="avFile" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/bmp" hidden @change="pickAvatar">
              <div class="m-card m-card-av">
                <button class="m-av-big" type="button" :disabled="avBusy" aria-label="換大頭貼" @click="avFile.click()"><img class="m-pic m-pic-lg" :class="'st-' + me.status" :src="meAv" alt="" width="112" height="112"></button>
                <p class="m-who">{{ myName }}</p>
                <p class="m-hint">點一下換大頭貼</p>
                <button class="m-link" type="button" v-if="selfHasUpload" :disabled="avBusy" @click="removeAvatar">改回自動產生</button>
                <p class="m-note" v-if="avMsg" role="status">{{ avMsg }}</p>
              </div>
              <div class="m-card m-form">
                <label>我的名字<input class="set-input" v-model="nameDraft" maxlength="40" enterkeyhint="done" @change="commitName" @keydown.enter="$event.target.blur()"><small class="m-fine">帳號的名字，所有設備共用，改了每台設備都會跟著變。</small></label>
                <p class="m-err" v-if="nameErr" role="alert">{{ nameErr }}</p>
                <label v-if="acct.signed_in">{{ AI_WAKE_LIMIT_LABEL }}<input class="set-input" type="number" inputmode="numeric" min="0" max="20" step="1" v-model="wakeDraft" enterkeyhint="done" @change="commitWake" @keydown.enter="$event.target.blur()"><small class="m-fine">{{ AI_WAKE_LIMIT_NOTE }}</small></label>
                <p class="m-err" v-if="wakeErr" role="alert">{{ wakeErr }}</p>
                <p class="m-acct">{{ accountText }}</p>
                <label>這台設備的名稱<input class="set-input" v-model="me.nick" maxlength="40" enterkeyhint="done" @change="commitNick" @keydown.enter="$event.target.blur()"><small class="m-fine">只有這支手機用：別台設備看到你從這裡寄信時，會標「從 {{ me.nick }}」。</small></label>
                <p class="m-err" v-if="nickErr" role="alert">{{ nickErr }}</p>
                <label>狀態<select class="set-sel" v-model="me.status"><option v-for="(label, key) in STATUS" :key="key" :value="key">{{ label }}</option></select></label>
                <label>個人訊息<input class="set-input" v-model="me.psm" maxlength="60" placeholder="輸入個人訊息" enterkeyhint="done" @keydown.enter="$event.target.blur()"></label>
              </div>
        </template>
        <template v-else-if="settingCat === 'notify'">
              <div class="m-card m-form">
                <label class="m-check"><input type="checkbox" v-model="prefs.vibrateNudge"> 對方傳來「震動」時，手機跟著震動</label>
                <label class="m-check"><input type="checkbox" v-model="prefs.vibrateMsg"> 收到新訊息時輕輕震一下</label>
              </div>
        </template>
        <template v-else-if="settingCat === 'update'">
          <div class="m-card m-form">
                <template v-if="upd.enabled">
                  <label class="m-check"><input type="checkbox" v-model="prefs.autoUpdate"> 自動檢查新版本</label>
                  <button class="m-btn" type="button" :disabled="upd.checking || upd.phase === 'downloading'" @click="checkUpdate(true)">{{ upd.checking ? '檢查中…' : '檢查更新' }}</button>
                  <p class="m-note" v-if="upd.manual" role="status">{{ upd.manual }}</p>
                </template>
            <p class="m-note" v-else>這個版本不提供自動檢查新版本。</p>
          </div>
        </template>
        <template v-else-if="settingCat === 'about'">
          <div class="m-card m-form">
                <p class="m-ver">ASN {{ info.version }}</p>
          </div>
        </template>
      </div>
    </section>

    <!-- 使用指引：滿版的獨立一頁（左上返回）；先列篇目，點一篇看內文。內文一律當純文字（guide-doc 不用 v-html） -->
    <section class="m-sheet m-guide" v-if="nav.sheet === 'guide'" role="dialog" aria-modal="true" :aria-label="GUIDE_ENTRY_LABEL">
      <header class="m-head m-chathead">
        <button class="m-icon-btn" type="button" aria-label="返回" @click="back"><svg class="m-ic" viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path d="M15 4.5L7.5 12 15 19.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <div class="m-head-tx"><div class="m-title">{{ guideOpen ? guideOpen.guide.title : GUIDE_ENTRY_LABEL }}</div><div class="m-conn" v-if="!guideOpen">{{ GUIDE_ENTRY_SUB }}</div></div>
      </header>
      <div class="m-sheet-body">
        <template v-if="guideOpen">
          <p class="m-guide-note" v-if="guideOpen.note" role="note">{{ guideOpen.note }}</p>
          <guide-doc :guide="guideOpen.guide"></guide-doc>        </template>
        <ul class="m-guide-list" v-else>
          <li v-for="g in guides" :key="g.key">
            <button class="m-row-btn" type="button" @click="openGuide(g.key)"><span class="m-row-tx"><b>{{ g.title }}</b><small>{{ g.sub }}</small><em class="m-guide-badge" :class="'is-' + g.fit" v-if="g.badge">{{ g.badge }}</em></span><span class="m-caret" aria-hidden="true">▸</span></button>
          </li>
        </ul>
      </div>
    </section>

    <!-- 開新夥伴（遠端開視窗）：視窗開在選的那台電腦上，手機只下指令 -->
    <section class="m-sheet" v-if="nav.sheet === 'launch'" role="dialog" aria-modal="true" aria-label="開新夥伴">
      <header class="m-head m-chathead">
        <button class="m-icon-btn" type="button" aria-label="返回" @click="back"><svg class="m-ic" viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path d="M15 4.5L7.5 12 15 19.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <div class="m-head-tx"><div class="m-title">{{ lchStep2 ? '設定這位夥伴' : '開新夥伴' }}</div><div class="m-conn">{{ lchStep2 ? '開在 ' + lch.deviceLabel : '先選一台電腦，視窗會開在那台上' }}</div></div>
      </header>
      <div class="m-sheet-body">
        <template v-if="lch.phase === 'form' && !lchStep2">
          <fieldset class="m-fs">
            <legend>電腦</legend>
            <button v-for="d in lchDevices" :key="d.key" type="button" class="m-opt" :class="{ on: lch.node === d.key, off: !d.ok }" :disabled="!d.ok" :aria-pressed="lch.node === d.key" @click="pickLaunchDevice(d.key)"><span class="m-opt-t">{{ d.label }}</span><small class="m-opt-why" v-if="!d.ok">{{ d.reason }}</small></button>
            <p class="m-note" v-if="!lchDevices.length">名單上還沒有其他電腦。</p>
            <p class="m-note" v-else-if="!lchData.loaded && !lchData.error">查詢各台電腦的設定中…</p>
            <p class="m-err" v-if="lchData.error">{{ lchData.error }}</p>
          </fieldset>
          <button class="m-btn m-btn-big" type="button" :disabled="!lchCanNext" @click="nextLaunch">下一步</button>
        </template>
        <template v-else-if="lch.phase === 'form'">
          <p class="m-note">電腦：{{ lch.deviceLabel }}</p>
          <template v-if="lch.node && lchElig.ok">
            <fieldset class="m-fs">
              <legend>模型</legend>
              <button v-for="m in lchChoices.models" :key="m.profileId" type="button" class="m-opt" :class="{ on: lch.profile === m.profileId }" :aria-pressed="lch.profile === m.profileId" @click="lch.profile = m.profileId"><span class="m-opt-t">{{ m.label }}</span><small class="m-opt-why">{{ m.modeLabel }}</small></button>
            </fieldset>
            <fieldset class="m-fs">
              <legend>運行</legend>
              <button v-for="c in lchRun.choices" :key="c.key" type="button" class="m-opt" :class="{ on: lchRun.selected === c.key, off: !c.ok }" :disabled="!c.ok" :aria-pressed="lchRun.selected === c.key"><span class="m-opt-t">{{ c.label }}</span><small class="m-opt-why" v-if="!c.ok">{{ c.why }}</small></button>
            </fieldset>
            <label class="m-field">工作資料夾<select class="set-sel" v-model="lch.cwd"><option v-for="c in lchChoices.cwds" :key="c" :value="c">{{ c }}</option></select></label>
            <label class="m-field">名字<input class="set-input" v-model="lch.name" maxlength="40" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
            <label class="m-field">第一句話（選填）<textarea class="set-area" v-model="lch.first" rows="3" maxlength="4000"></textarea></label>
          </template>
          <p class="m-err" v-if="lch.error" role="alert">{{ lch.error }}</p>
          <p class="m-note" v-else-if="lch.node && lchFormErr">{{ lchFormErr }}</p>
          <button class="m-btn m-btn-big" type="button" :disabled="lch.busy || !!lchFormErr" @click="submitLaunch">{{ lch.busy ? '送出中…' : '開啟' }}</button>
        </template>
        <template v-else>
          <p class="m-prog" :class="'is-' + lch.vphase" role="status">{{ lch.text }}</p>
          <p class="m-note" v-if="lch.detail">{{ lch.detail }}</p>
          <div class="m-bar" v-if="lch.vphase === 'sending' || lch.vphase === 'opening' || lch.vphase === 'waiting'" aria-hidden="true"><i></i></div>
          <button class="m-btn m-btn-big" type="button" v-if="lch.vphase === 'done'" @click="openLaunched">開始對話</button>
          <button class="m-btn" type="button" v-if="lch.vphase === 'failed'" @click="lch.phase = 'form'">再試一次</button>
          <button class="m-btn" type="button" @click="closeLaunch">{{ lch.vphase === 'done' || lch.vphase === 'failed' ? '關閉' : '先關閉（會在背景繼續）' }}</button>
        </template>
      </div>
    </section>

    <!-- 「⋯」選單：底部浮層，放在三個分頁之外（分頁排有 transform 與裁切，放裡面會被裁掉）；項目與可按條件全部來自 menuItems -->
    <div class="m-ops" v-if="nav.sheet === 'ops'" @click.self="back">
      <section class="m-ops-panel" role="dialog" aria-modal="true" :aria-label="opsTitle">
        <h2 class="m-ops-h">{{ opsTitle }}</h2>
        <template v-if="ops.phase === 'menu'">
          <button v-for="g in groupItems" :key="g.key" type="button" class="m-ops-item" @click="pickGroup(g.key)"><span class="m-opt-t">{{ g.label }}</span></button>
          <p class="m-ops-shared" v-for="n in opsView.notes" :key="n" role="note">{{ n }}</p>
          <button v-for="i in opsView.rows" :key="i.key" type="button" class="m-ops-item" :class="{ off: !i.ok }" :aria-disabled="i.ok ? 'false' : 'true'" :aria-describedby="i.ok ? null : 'ops-why-' + i.key" @click="pickOp(i.key)"><span class="m-opt-t">{{ i.label }}</span><small class="m-opt-why" :id="'ops-why-' + i.key" v-if="!i.ok && i.why">{{ i.why }}</small></button>
          <button type="button" class="m-btn m-ops-cancel" @click="back">取消</button>
        </template>
        <template v-else-if="ops.phase === 'rename'">
          <p class="m-ops-lead">{{ opsText.lead }}</p>
          <input class="set-input m-ops-input" v-model="ops.newName" maxlength="40" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="新名字" @keydown.enter.prevent="submitOp('rename')">
          <p class="m-err" v-if="ops.error" role="alert">{{ ops.error }}</p>
          <button type="button" class="m-btn m-btn-big" @click="submitOp('rename')">{{ opsText.ok }}</button>
          <button type="button" class="m-btn m-ops-cancel" @click="ops.phase = 'menu'; ops.error = ''">返回</button>
        </template>
        <template v-else-if="ops.phase === 'model' && opsIsPi">
          <p class="m-ops-lead">{{ opsText.lead }}</p>
          <ul class="m-ops-points" v-if="opsText.points.length"><li v-for="p in opsText.points" :key="p">{{ p }}</li></ul>
          <select class="set-sel m-ops-input" v-if="opsPiChoices.groups.length" v-model="ops.model" aria-label="模型">
            <optgroup v-for="g in opsPiChoices.groups" :key="g.provider" :label="g.provider"><option v-for="o in g.options" :key="o.value" :value="o.value">{{ o.label }}</option></optgroup>
          </select>
          <input class="set-input m-ops-input" v-else v-model="ops.model" maxlength="101" autocomplete="off" autocapitalize="off" spellcheck="false" :placeholder="opsText.placeholder || '例如 anthropic/claude-sonnet-5'" aria-label="模型" @keydown.enter.prevent="submitOp('model')">
          <p class="m-note" v-if="opsPiNote">{{ opsPiNote }}</p>
          <p class="m-err" v-if="ops.error" role="alert">{{ ops.error }}</p>
          <button type="button" class="m-btn m-btn-big" @click="submitOp('model')">{{ opsText.ok }}</button>
          <button type="button" class="m-btn m-ops-cancel" @click="ops.phase = 'menu'; ops.error = ''">返回</button>
        </template>
        <template v-else-if="ops.phase === 'model'">
          <button v-for="m in opsModels" :key="m.id" type="button" class="m-ops-item" @click="ops.model = m.id; submitOp('model')"><span class="m-opt-t">{{ m.label }}</span></button>
          <p class="m-note">{{ opsModelNote }}</p>
          <p class="m-err" v-if="ops.error" role="alert">{{ ops.error }}</p>
          <button type="button" class="m-btn m-ops-cancel" @click="ops.phase = 'menu'; ops.error = ''">返回</button>
        </template>
        <template v-else-if="ops.phase === 'close' || ops.phase === 'handover' || ops.phase === 'restart' || ops.phase === 'remove'">
          <p class="m-ops-lead">{{ opsText.lead }}</p>
          <ul class="m-ops-points" v-if="opsText.points.length"><li v-for="p in opsText.points" :key="p">{{ p }}</li></ul>
          <label class="m-field" v-if="opsText.ack"><input type="checkbox" v-model="ops.ack" aria-label="確認接手前要先關掉終端機"> {{ opsText.ack }}</label>
          <label class="m-field" v-if="ops.phase === 'handover' && !opsText.ack">補充的話（選填，會附在新夥伴的第一句話後面）<textarea class="set-area" rows="3" v-model="ops.note" maxlength="1000"></textarea></label>
          <p class="m-err" v-if="ops.error" role="alert">{{ ops.error }}</p>
          <button type="button" class="m-btn m-btn-big" :class="{ 'm-danger': ops.phase === 'close' || opsText.danger }" @click="submitOp(ops.phase)">{{ opsText.ok }}</button>
          <button type="button" class="m-btn m-ops-cancel" @click="ops.phase = 'menu'; ops.error = ''">返回</button>
        </template>
        <template v-else>
          <p class="m-prog" :class="ops.view ? 'is-' + ops.view.phase : ''" role="status">{{ ops.view ? ops.view.text : '' }}</p>
          <dl class="m-ops-rows" v-if="ops.view && ops.view.rows && ops.view.rows.length"><template v-for="r in ops.view.rows" :key="r.label"><dt>{{ r.label }}</dt><dd>{{ r.value }}</dd></template></dl>
          <p class="m-note" v-if="ops.view && ops.view.rows && !ops.view.rows.length">沒有更多資料。</p>
          <div class="m-bar" v-if="ops.view && !ops.view.done" aria-hidden="true"><i></i></div>
          <button type="button" class="m-btn m-ops-cancel" @click="back">{{ ops.view && ops.view.done ? '關閉' : '先關掉（照常進行）' }}</button>
        </template>
      </section>
    </div>

    <!-- 別台電腦／雲端代理要密碼（#26 第二期）：底部浮層，樣式沿用「⋯」選單。哪台電腦由後台查出，程式與用途是對方自報（標示出來）；密碼在手機上加密才送出 -->
    <div class="m-ops" v-if="nav.sheet === 'secret' && sec.cur" @click.self="laterSecret">
      <section class="m-ops-panel" role="dialog" aria-modal="true" :aria-label="SECRET_TEXT.title">
        <h2 class="m-ops-h">{{ SECRET_TEXT.title }}</h2>
        <p class="m-ops-lead">{{ SECRET_TEXT.lead }}</p>
        <dl class="m-ops-rows">
          <dt>{{ SECRET_TEXT.deviceLabel }}</dt><dd>{{ sec.cur.nodeName }}</dd>
          <dt>{{ SECRET_TEXT.programLabel }}</dt><dd>{{ sec.cur.program }}</dd>
          <dt>{{ SECRET_TEXT.purposeLabel }}</dt><dd>{{ sec.cur.purpose }}</dd>
          <dt>{{ SECRET_TEXT.fpLabel }}</dt><dd>{{ sec.cur.fingerprint }}</dd>
        </dl>
        <p class="m-note">{{ SECRET_TEXT.fpNote }}　{{ secCountdown }}</p>
        <label class="m-field">{{ SECRET_TEXT.inputLabel }}<input class="set-input m-ops-input" type="password" v-model="sec.secret" autocomplete="off" autocapitalize="off" spellcheck="false" :disabled="sec.busy" @keydown.enter.prevent="answerSecret(false)"></label>
        <p class="m-err" v-if="sec.error" role="alert">{{ sec.error }}</p>
        <button type="button" class="m-btn m-btn-big" :disabled="sec.busy" @click="answerSecret(false)">{{ SECRET_TEXT.ok }}</button>
        <button type="button" class="m-btn m-ops-cancel m-danger" :disabled="sec.busy" @click="answerSecret(true)">{{ SECRET_TEXT.deny }}</button>
        <button type="button" class="m-btn m-ops-cancel" :disabled="sec.busy" @click="laterSecret">{{ SECRET_TEXT.later }}</button>
      </section>
    </div>
    <!-- 電腦要往終端送字／代答提問（#285、#296）：底部浮層，樣式沿用「⋯」選單。哪台電腦由設備名稱對來；預覽只放前 200 字且已去掉控制字元。確認或拒絕都在手機上，不必去遠端桌面 -->
    <div class="m-ops" v-if="nav.sheet === 'termreq' && tq.cur" @click.self="laterTermReq">
      <section class="m-ops-panel" role="dialog" aria-modal="true" :aria-label="tq.cur.kind === 'answer' ? TERMREQ_TEXT.titleAnswer : TERMREQ_TEXT.titleSend">
        <h2 class="m-ops-h">{{ tq.cur.kind === 'answer' ? TERMREQ_TEXT.titleAnswer : TERMREQ_TEXT.titleSend }}</h2>
        <p class="m-ops-lead">{{ tq.cur.kind === 'answer' ? TERMREQ_TEXT.leadAnswer : TERMREQ_TEXT.leadSend }}</p>
        <dl class="m-ops-rows">
          <dt>{{ TERMREQ_TEXT.deviceLabel }}</dt><dd>{{ tq.cur.deviceName }}</dd>
          <dt>{{ TERMREQ_TEXT.termLabel }}</dt><dd>{{ tq.cur.term }}</dd>
          <template v-if="tq.cur.folder"><dt>{{ TERMREQ_TEXT.folderLabel }}</dt><dd>{{ tq.cur.folder }}</dd></template>
          <dt>{{ TERMREQ_TEXT.previewLabel }}</dt><dd class="m-term-preview">{{ tq.cur.preview }}</dd>
        </dl>
        <div class="m-term-opts" role="group" :aria-label="TERMREQ_TEXT.optionLabel" v-if="tq.cur.kind === 'answer'">
          <button type="button" class="m-btn m-term-opt" v-for="o in tq.cur.options" :key="o.n" :class="{ on: tq.choice === o.n }" :aria-pressed="tq.choice === o.n" :disabled="tq.busy" @click="tq.choice = o.n">{{ o.label }}</button>
        </div>
        <p class="m-note" v-if="tq.cur.kind === 'send'">{{ tq.cur.enter ? TERMREQ_TEXT.enterYes : TERMREQ_TEXT.enterNo }}</p>
        <p class="m-note">{{ TERMREQ_TEXT.note }}　{{ tqCountdown }}</p>
        <p class="m-err" v-if="tq.error" role="alert">{{ tq.error }}</p>
        <button type="button" class="m-btn m-btn-big" :disabled="tq.busy || (tq.cur.kind === 'answer' && tq.choice === null)" @click="decideTermReq('approve')">{{ TERMREQ_TEXT.ok }}</button>
        <button type="button" class="m-btn m-ops-cancel m-danger" :disabled="tq.busy" @click="decideTermReq('deny')">{{ TERMREQ_TEXT.deny }}</button>
        <button type="button" class="m-btn m-ops-cancel" :disabled="tq.busy" @click="laterTermReq">{{ TERMREQ_TEXT.later }}</button>
      </section>
    </div>
    <group-sheet :flow="groupFlow"></group-sheet>
  </template>
</div>
<script src="vendor/vue.global.prod.js"></script>
<script type="module" src="m.js"></script>
</body>
</html>
