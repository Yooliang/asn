<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#8fbfec">
<title>ASN</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="mobile.css">
</head>
<body class="m-body">
<!-- 開機畫面：放在 #app 外面，Vue 掛上去之前就看得到，掛上後由 m.js 移除（#app 在掛上前整個藏起來，不會露出樣板原文） -->
<div id="splash" class="m-center"><img class="m-logo" src="img/logo.svg" alt=""><p>啟動中…</p></div>
<div id="app" class="m" v-cloak>
  <!-- 啟動中、無法啟動 -->
  <section class="m-center" v-if="screen === 'fatal'"><img class="m-logo" src="img/logo.svg" alt=""><p role="alert">ASN 無法啟動：{{ fatal }}</p></section>

  <!-- 首次登入引導：帳號名稱（已有就跳過）＋這支手機的名稱 -->
  <section class="m-login" v-else-if="screen === 'onboard'">
    <div class="m-login-card">
      <div class="login-avatar is-logo"><img src="img/logo.svg" alt=""></div>
      <h1 class="login-h">{{ ONBOARD_TEXT.title }}</h1>
      <onboard-card :steps="onboard.steps" :device-default="info.window_name" :api="onboardApi" :mobile="true" @done="finishOnboard"></onboard-card>
    </div>
  </section>

  <!-- 登入 -->
  <section class="m-login" v-else-if="screen === 'login'">
    <div class="m-login-card">
      <div class="login-avatar is-logo"><img src="img/logo.svg" alt=""></div>
      <h1 class="login-h">歡迎使用 ASN</h1>
      <p class="login-sub">登入後，這支手機會自動出現在你的名單裡。</p>
      <button v-for="p in PROVIDERS" :key="p.key" class="m-btn m-btn-big" type="button" :disabled="!canStart(login.phase)" @click="startLogin(p.key)">{{ p.label }}</button>
      <p class="login-note" v-if="loginNote" role="status">{{ loginNote }}</p>
      <button class="m-btn" type="button" v-if="login.phase === 'waiting'" @click="cancelLogin">取消</button>
      <p class="login-err" v-if="login.phase === 'error'" role="alert">{{ login.error }}</p>
    </div>
  </section>

  <!-- 登入後 -->
  <template v-else>
    <div class="m-banner" v-if="banner" role="status" @click="openBanner">
      <span class="dp xs" :class="'st-' + banner.status"><span><img :src="avById(banner.id)" alt=""></span></span>
      <span class="m-banner-tx" :class="{ wrap: banner.handover }"><b v-html="emo(banner.nick)"></b><small>{{ banner.line }}</small></span>
      <button class="m-banner-act" type="button" v-if="banner.handover" @click.stop="bannerHandover">接班換手</button>
    </div>

    <!-- 三個大分頁：夥伴／對話／設置。左右滑動切換（跟手，放開吸附到最近的分頁），也可以點上方分頁；下拉重整只在夥伴與對話兩頁 -->
    <section class="m-page">
      <nav class="m-tabs" :class="{ dragging: sw.dragging }" role="tablist" aria-label="大分頁">
        <i class="m-ind" :style="{ transform: 'translateX(' + indicator * 100 + '%)' }" aria-hidden="true"></i>
        <button v-for="t in TABS" :key="t" type="button" role="tab" :class="{ on: nav.tab === t }" :aria-selected="nav.tab === t" @click="goTab(t)"><span>{{ TAB_LABEL[t] }}</span><i class="red" v-if="t === 'chats' && unreadTotal"></i></button>
      </nav>
      <div class="m-upd" v-if="upd.enabled && upd.phase !== 'idle'" role="status" :class="{ failed: upd.phase === 'failed' }">
        <span class="m-upd-tx">{{ updText }}</span>
        <button class="m-btn m-upd-btn" type="button" v-if="upd.phase !== 'downloading'" @click="startUpdate">{{ updButton }}</button>
        <span class="m-upd-hint" v-if="upd.hint">{{ upd.hint }}</span>
      </div>
      <div class="m-pager-wrap" @touchstart.passive="swipeStart($event, 'pager')" @touchmove="swipeMove" @touchend="swipeEnd" @touchcancel="swipeEnd">
        <div class="m-pager" :class="{ dragging: sw.dragging }" :style="pagerStyle">

          <!-- 夥伴：依設備分組，廠商小徽章、最後一句話 -->
          <section class="m-pg" aria-label="夥伴">
            <header class="m-head">
              <button class="m-me" type="button" aria-label="設置" @click="goTab('me')"><img class="m-pic" :class="'st-' + me.status" :src="meAv" alt="" width="44" height="44"></button>
              <div class="m-head-tx">
                <div class="m-title">{{ myName }}</div>
                <div class="m-conn"><span class="dot" :class="conn === 'on' ? 'st-online' : conn === 'off' ? 'st-busy' : 'st-away'"></span><span class="m-conn-tx">{{ conn === 'on' ? STATUS[me.status] : CONN_LABEL[conn] }}<template v-if="conn === 'on' && me.psm"> · {{ me.psm }}</template></span></div>
              </div>
              <button class="m-icon-btn" type="button" aria-label="開新夥伴" @click="openLaunch('')"><svg class="m-ic" viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path d="M12 4.5v15M4.5 12h15" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></button>
            </header>
            <ptr-zone :ptr="pf.ptr"></ptr-zone>
            <div class="m-scroll" :ref="el => (pf.ptr.el = el)" @touchstart.passive="pf.start" @touchmove="pf.move" @touchend="pf.end" @touchcancel="pf.end">
              <p class="m-archive-note" v-if="archiveNote" role="status">{{ archiveNote }}</p>
              <div class="m-search"><input v-model="query" type="search" placeholder="搜尋聯絡人…" aria-label="搜尋聯絡人" enterkeyhint="search"></div>
              <div v-for="g in groups" :key="g.key" class="m-group">
                <button class="m-ghead" type="button" :aria-expanded="!collapsed[g.key]" @click="collapsed[g.key] = !collapsed[g.key]">
                  <span class="m-caret" :class="{ open: !collapsed[g.key] }">▸</span>{{ groupHeading(g) }}
                </button>
                <ul v-show="!collapsed[g.key]">
                  <li v-for="c in g.items" :key="c.id" :class="{ 'm-archived-row': g.kind === 'archived' }">
                    <button class="m-buddy" :class="{ offline: c.status === 'offline' }" type="button" @click="openChat(c.id)">
                      <span class="m-av-wrap">
                        <span class="dp sm" :class="'st-' + c.status"><span><img :src="avOf(c)" alt=""></span></span>
                        <span class="m-vendor" aria-hidden="true" v-html="vendorIcon(c)"></span>
                      </span>
                      <span class="b-text">
                        <span class="b-line"><span class="b-nick" v-html="emo(c.nick)"></span><span class="b-ctx" :class="{ danger: contextLabel(c).danger }" v-if="contextLabel(c)">{{ contextLabel(c).text }}</span><span class="b-st" v-if="statusNote(c.status)">{{ statusNote(c.status) }}</span></span>
                        <span class="b-psm" v-if="c.psm" v-html="emo(c.psm)"></span>
                        <span class="b-last" v-if="lastOf(c.id)">{{ lastOf(c.id) }}</span>
                      </span>
                      <span class="unread" v-if="c.unread">{{ c.unread }}</span>
                    </button>
                    <button class="m-unarchive" type="button" v-if="g.kind === 'archived'" :aria-label="'取消封存 ' + c.nick" @click="setArchived(c, false)">取消封存</button>
                  </li>
                </ul>
              </div>
              <!-- 群組對話：我參加的群組，放在各設備分組之後；點進去在對話分頁看訊息、發言 -->
              <div class="m-group m-rooms" v-if="roomRows.length">
                <button class="m-ghead" type="button" :aria-expanded="!collapsed[ROOM_GROUP_KEY]" @click="collapsed[ROOM_GROUP_KEY] = !collapsed[ROOM_GROUP_KEY]">
                  <span class="m-caret" :class="{ open: !collapsed[ROOM_GROUP_KEY] }">▸</span>{{ ROOM_GROUP_LABEL }}（{{ roomRows.length }}）
                </button>
                <ul v-show="!collapsed[ROOM_GROUP_KEY]">
                  <li v-for="r in roomRows" :key="r.id">
                    <button class="m-buddy" type="button" @click="openRoom(r.chatId)">
                      <span class="m-av-wrap"><span class="m-room-ic" aria-hidden="true"><svg viewBox="0 0 24 24" width="24" height="24"><circle cx="9" cy="9" r="3.2" fill="currentColor"/><circle cx="16.5" cy="10" r="2.6" fill="currentColor" opacity=".7"/><path d="M3.5 19c.4-3.2 2.7-5 5.5-5s5.1 1.8 5.5 5zM14.6 14.4c.6-.2 1.3-.3 1.9-.3 2.3 0 4 1.5 4.3 4.9h-4.4c-.1-1.9-.7-3.5-1.8-4.6z" fill="currentColor"/></svg></span></span>
                      <span class="b-text">
                        <span class="b-line"><span class="b-nick" v-html="emo(r.name)"></span><span class="b-st">{{ r.count }} 位成員</span></span>
                        <span class="b-last" v-if="r.last">{{ r.last }}</span>
                      </span>
                      <span class="unread" v-if="r.unread">{{ r.unread }}</span>
                    </button>
                  </li>
                </ul>
              </div>
              <div class="empty-list" v-if="!groups.length && !roomRows.length">{{ emptyText }}</div>
            </div>
          </section>

          <!-- 對話：最後使用的那一位的對話內容（從夥伴分頁點一位就成為最後使用）；右上角「⋯」管理這位的視窗 -->
          <section class="m-pg m-chat" :class="{ shake, 'is-room': chatFriend && chatFriend.room }" aria-label="對話">
            <header class="m-head m-chathead" :class="{ 'is-busy': chatFriend && headTone(chatFriend.status) === 'busy' }">
              <template v-if="chatFriend">
                <img class="m-pic" :class="'st-' + chatFriend.status" :src="avOf(chatFriend)" alt="" width="44" height="44">
                <div class="m-head-tx">
                  <div class="m-title" v-html="emo(chatFriend.nick)"></div>
                  <div class="m-conn" v-if="chatFriend.room">{{ chatFriend.psm }}</div>
                  <div class="m-conn" v-else>{{ STATUS[chatFriend.status] }}<template v-if="chatFriend.psm"> · <span v-html="emo(chatFriend.psm)"></span></template></div>
                </div>
                <button class="m-icon-btn" type="button" aria-label="更多操作" v-if="opsItems.length" @click="openOps"><svg class="m-ic" viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><circle cx="5" cy="12" r="2.4" fill="currentColor"/><circle cx="12" cy="12" r="2.4" fill="currentColor"/><circle cx="19" cy="12" r="2.4" fill="currentColor"/></svg></button>
              </template>
              <template v-else>
                <button class="m-me" type="button" aria-label="設置" @click="goTab('me')"><img class="m-pic" :class="'st-' + me.status" :src="meAv" alt="" width="44" height="44"></button>
                <div class="m-head-tx"><div class="m-title">對話</div></div>
              </template>
            </header>
            <div class="m-ops-run" v-if="opsBanner" :class="'is-' + opsBanner.phase" role="status">
              <p class="m-ops-run-tx">{{ opsBanner.text }}</p>
              <ol class="m-ops-steps" v-if="opsBanner.steps.length"><li v-for="s in opsBanner.steps" :key="s.key" :class="'is-' + s.state"><b aria-hidden="true">{{ s.mark }}</b>{{ s.text }}</li></ol>
              <p class="m-ops-run-more" v-for="l in opsBanner.extra" :key="l">{{ l }}</p>
              <button class="m-btn m-ops-run-btn" type="button" v-if="opsBanner.done" @click="dismissRun">知道了</button>
            </div>
            <p class="m-err m-room-note" v-if="roomNote && chatFriend && chatFriend.room" role="alert">{{ roomNote }}</p>
            <chat-pane v-if="chatFriend" :friend="chatFriend" :me="meForChat" :log="chatLog" :friend-av="avOf(chatFriend)" :me-av="meAv"
              dp-mode="inline" bubble="auto" toolbar="bottom" win-mode="merged" :hide-busy-warn="true" :active="false" :enter-sends="false" :photo-api="photoApi" :call-api="callApi" @call-state="onCallState" :load-older="loadOlder"
              @send="text => sendTo(chatFriend.id, text)" @nudge="nudgeTo(chatFriend.id)" @attach="(p, cap) => sendAttachTo(chatFriend.id, p, cap)"></chat-pane>
            <div class="m-scroll" v-else><div class="empty-list">{{ chatEmptyText }}</div></div>
          </section>

          <!-- 設置 -->
          <section class="m-pg" aria-label="設置">
            <header class="m-head">
              <button class="m-me" type="button" aria-label="設置" @click="goTab('me')"><img class="m-pic" :class="'st-' + me.status" :src="meAv" alt="" width="44" height="44"></button>
              <div class="m-head-tx"><div class="m-title">設置</div></div>
            </header>
            <div class="m-scroll m-meview">
              <input ref="avFile" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/bmp" hidden @change="pickAvatar">
              <div class="m-card">
                <button class="m-av-big" type="button" :disabled="avBusy" aria-label="換大頭貼" @click="avFile.click()"><img class="m-pic m-pic-lg" :class="'st-' + me.status" :src="meAv" alt="" width="112" height="112"></button>
                <p class="m-who">{{ myName }}</p>
                <p class="m-hint">點一下換大頭貼</p>
                <button class="m-link" type="button" v-if="selfHasUpload" :disabled="avBusy" @click="removeAvatar">改回自動產生</button>
                <p class="m-note" v-if="avMsg" role="status">{{ avMsg }}</p>
              </div>
              <div class="m-card m-form">
                <label>我的名字<input class="set-input" v-model="nameDraft" maxlength="40" enterkeyhint="done" @change="commitName" @keydown.enter="$event.target.blur()"><small class="m-fine">帳號的名字，所有設備共用，改了每台設備都會跟著變。</small></label>
                <p class="m-err" v-if="nameErr" role="alert">{{ nameErr }}</p>
                <p class="m-acct">{{ accountText }}</p>
                <label>這台設備的名稱<input class="set-input" v-model="me.nick" maxlength="40" enterkeyhint="done" @change="commitNick" @keydown.enter="$event.target.blur()"><small class="m-fine">只有這支手機用：別台設備看到你從這裡寄信時，會標「從 {{ me.nick }}」。</small></label>
                <p class="m-err" v-if="nickErr" role="alert">{{ nickErr }}</p>
                <label>狀態<select class="set-sel" v-model="me.status"><option v-for="(label, key) in STATUS" :key="key" :value="key">{{ label }}</option></select></label>
                <label>個人訊息<input class="set-input" v-model="me.psm" maxlength="60" placeholder="輸入個人訊息" enterkeyhint="done" @keydown.enter="$event.target.blur()"></label>
              </div>
              <div class="m-card m-form">
                <label class="m-check"><input type="checkbox" v-model="prefs.vibrateNudge"> 對方傳來「震動」時，手機跟著震動</label>
                <label class="m-check"><input type="checkbox" v-model="prefs.vibrateMsg"> 收到新訊息時輕輕震一下</label>
              </div>
              <div class="m-card m-form">
                <template v-if="upd.enabled">
                  <label class="m-check"><input type="checkbox" v-model="prefs.autoUpdate"> 自動檢查新版本</label>
                  <button class="m-btn" type="button" :disabled="upd.checking || upd.phase === 'downloading'" @click="checkUpdate(true)">{{ upd.checking ? '檢查中…' : '檢查更新' }}</button>
                  <p class="m-note" v-if="upd.manual" role="status">{{ upd.manual }}</p>
                </template>
                <p class="m-ver">ASN {{ info.version }}</p>
              </div>
              <div class="m-card m-form m-guide-entry">
                <button class="m-row-btn" type="button" @click="openGuides"><span class="m-row-tx"><b>{{ GUIDE_ENTRY_LABEL }}</b><small>{{ GUIDE_ENTRY_SUB }}</small></span><span class="m-caret" aria-hidden="true">▸</span></button>
              </div>
              <div class="m-logout">
                <button class="m-btn m-danger" type="button" :disabled="loggingOut" @click="doLogout">登出</button>
              </div>
            </div>
          </section>
        </div>
      </div>

    </section>

    <!-- 使用指引：滿版的獨立一頁（左上返回）；先列篇目，點一篇看內文。內文一律當純文字（guide-doc 不用 v-html） -->
    <section class="m-sheet m-guide" v-if="nav.sheet === 'guide'" role="dialog" aria-modal="true" :aria-label="GUIDE_ENTRY_LABEL">
      <header class="m-head m-chathead">
        <button class="m-icon-btn" type="button" aria-label="返回" @click="back"><svg class="m-ic" viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path d="M15 4.5L7.5 12 15 19.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <div class="m-head-tx"><div class="m-title">{{ guideOpen ? guideOpen.guide.title : GUIDE_ENTRY_LABEL }}</div><div class="m-conn" v-if="!guideOpen">{{ GUIDE_ENTRY_SUB }}</div></div>
      </header>
      <div class="m-sheet-body">
        <template v-if="guideOpen">
          <p class="m-guide-note" v-if="guideOpen.note" role="note">{{ guideOpen.note }}</p>
          <guide-doc :guide="guideOpen.guide"></guide-doc>        </template>
        <ul class="m-guide-list" v-else>
          <li v-for="g in guides" :key="g.key">
            <button class="m-row-btn" type="button" @click="openGuide(g.key)"><span class="m-row-tx"><b>{{ g.title }}</b><small>{{ g.sub }}</small><em class="m-guide-badge" :class="'is-' + g.fit" v-if="g.badge">{{ g.badge }}</em></span><span class="m-caret" aria-hidden="true">▸</span></button>
          </li>
        </ul>
      </div>
    </section>

    <!-- 開新夥伴（遠端開視窗）：視窗開在選的那台電腦上，手機只下指令 -->
    <section class="m-sheet" v-if="nav.sheet === 'launch'" role="dialog" aria-modal="true" aria-label="開新夥伴">
      <header class="m-head m-chathead">
        <button class="m-icon-btn" type="button" aria-label="返回" @click="back"><svg class="m-ic" viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path d="M15 4.5L7.5 12 15 19.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <div class="m-head-tx"><div class="m-title">開新夥伴</div><div class="m-conn">視窗會開在你選的那台電腦上</div></div>
      </header>
      <div class="m-sheet-body">
        <template v-if="lch.phase === 'form'">
          <fieldset class="m-fs">
            <legend>電腦</legend>
            <button v-for="d in lchDevices" :key="d.key" type="button" class="m-opt" :class="{ on: lch.node === d.key, off: !d.ok }" :disabled="!d.ok" :aria-pressed="lch.node === d.key" @click="pickLaunchDevice(d.key)"><span class="m-opt-t">{{ d.label }}</span><small class="m-opt-why" v-if="!d.ok">{{ d.reason }}</small></button>
            <p class="m-note" v-if="!lchDevices.length">名單上還沒有其他電腦。</p>
            <p class="m-note" v-else-if="!lchData.loaded && !lchData.error">查詢各台電腦的設定中…</p>
            <p class="m-err" v-if="lchData.error">{{ lchData.error }}</p>
          </fieldset>
          <template v-if="lch.node && lchElig.ok">
            <fieldset class="m-fs">
              <legend>模型</legend>
              <button v-for="m in lchChoices.models" :key="m.profileId" type="button" class="m-opt" :class="{ on: lch.profile === m.profileId }" :aria-pressed="lch.profile === m.profileId" @click="lch.profile = m.profileId"><span class="m-opt-t">{{ m.label }}</span><small class="m-opt-why">{{ m.modeLabel }}</small></button>
            </fieldset>
            <label class="m-field">工作資料夾<select class="set-sel" v-model="lch.cwd"><option v-for="c in lchChoices.cwds" :key="c" :value="c">{{ c }}</option></select></label>
            <label class="m-field">名字<input class="set-input" v-model="lch.name" maxlength="40" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
            <label class="m-field">第一句話（選填）<textarea class="set-area" v-model="lch.first" rows="3" maxlength="4000"></textarea></label>
          </template>
          <p class="m-err" v-if="lch.error" role="alert">{{ lch.error }}</p>
          <p class="m-note" v-else-if="lch.node && lchFormErr">{{ lchFormErr }}</p>
          <button class="m-btn m-btn-big" type="button" :disabled="lch.busy || !!lchFormErr" @click="submitLaunch">{{ lch.busy ? '送出中…' : '開啟' }}</button>
        </template>
        <template v-else>
          <p class="m-prog" :class="'is-' + lch.vphase" role="status">{{ lch.text }}</p>
          <p class="m-note" v-if="lch.detail">{{ lch.detail }}</p>
          <div class="m-bar" v-if="lch.vphase === 'sending' || lch.vphase === 'opening' || lch.vphase === 'waiting'" aria-hidden="true"><i></i></div>
          <button class="m-btn m-btn-big" type="button" v-if="lch.vphase === 'done'" @click="openLaunched">開始對話</button>
          <button class="m-btn" type="button" v-if="lch.vphase === 'failed'" @click="lch.phase = 'form'">再試一次</button>
          <button class="m-btn" type="button" @click="back">{{ lch.vphase === 'done' || lch.vphase === 'failed' ? '關閉' : '先關閉（會在背景繼續）' }}</button>
        </template>
      </div>
    </section>

    <!-- 「⋯」選單：底部浮層，放在三個分頁之外（分頁排有 transform 與裁切，放裡面會被裁掉）；項目與可按條件全部來自 menuItems -->
    <div class="m-ops" v-if="nav.sheet === 'ops'" @click.self="back">
      <section class="m-ops-panel" role="dialog" aria-modal="true" :aria-label="opsTitle">
        <h2 class="m-ops-h">{{ opsTitle }}</h2>
        <template v-if="ops.phase === 'menu'">
          <button v-for="i in opsItems" :key="i.key" type="button" class="m-ops-item" :class="{ off: !i.ok }" :disabled="!i.ok" @click="pickOp(i.key)"><span class="m-opt-t">{{ i.label }}</span><small class="m-opt-why" v-if="!i.ok">{{ i.reason }}</small></button>
          <button type="button" class="m-btn m-ops-cancel" @click="back">取消</button>
        </template>
        <template v-else-if="ops.phase === 'rename'">
          <p class="m-ops-lead">{{ opsText.lead }}</p>
          <input class="set-input m-ops-input" v-model="ops.newName" maxlength="40" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="新名字" @keydown.enter.prevent="submitOp('rename')">
          <p class="m-err" v-if="ops.error" role="alert">{{ ops.error }}</p>
          <button type="button" class="m-btn m-btn-big" @click="submitOp('rename')">{{ opsText.ok }}</button>
          <button type="button" class="m-btn m-ops-cancel" @click="ops.phase = 'menu'; ops.error = ''">返回</button>
        </template>
        <template v-else-if="ops.phase === 'model'">
          <button v-for="m in opsModels" :key="m.id" type="button" class="m-ops-item" @click="ops.model = m.id; submitOp('model')"><span class="m-opt-t">{{ m.label }}</span></button>
          <p class="m-note">{{ opsModelNote }}</p>
          <p class="m-err" v-if="ops.error" role="alert">{{ ops.error }}</p>
          <button type="button" class="m-btn m-ops-cancel" @click="ops.phase = 'menu'; ops.error = ''">返回</button>
        </template>
        <template v-else-if="ops.phase === 'close' || ops.phase === 'handover'">
          <p class="m-ops-lead">{{ opsText.lead }}</p>
          <ul class="m-ops-points" v-if="opsText.points.length"><li v-for="p in opsText.points" :key="p">{{ p }}</li></ul>
          <label class="m-field" v-if="ops.phase === 'handover'">補充的話（選填，會附在新夥伴的第一句話後面）<textarea class="set-area" rows="3" v-model="ops.note" maxlength="1000"></textarea></label>
          <p class="m-err" v-if="ops.error" role="alert">{{ ops.error }}</p>
          <button type="button" class="m-btn m-btn-big" :class="{ 'm-danger': ops.phase === 'close' }" @click="submitOp(ops.phase)">{{ opsText.ok }}</button>
          <button type="button" class="m-btn m-ops-cancel" @click="ops.phase = 'menu'; ops.error = ''">返回</button>
        </template>
        <template v-else>
          <p class="m-prog" :class="ops.view ? 'is-' + ops.view.phase : ''" role="status">{{ ops.view ? ops.view.text : '' }}</p>
          <dl class="m-ops-rows" v-if="ops.view && ops.view.rows && ops.view.rows.length"><template v-for="r in ops.view.rows" :key="r.label"><dt>{{ r.label }}</dt><dd>{{ r.value }}</dd></template></dl>
          <p class="m-note" v-if="ops.view && ops.view.rows && !ops.view.rows.length">沒有更多資料。</p>
          <div class="m-bar" v-if="ops.view && !ops.view.done" aria-hidden="true"><i></i></div>
          <button type="button" class="m-btn m-ops-cancel" @click="back">{{ ops.view && ops.view.done ? '關閉' : '先關掉（照常進行）' }}</button>
        </template>
      </section>
    </div>

    <!-- 別台電腦／雲端代理要密碼（#26 第二期）：底部浮層，樣式沿用「⋯」選單。哪台電腦由後台查出，程式與用途是對方自報（標示出來）；密碼在手機上加密才送出 -->
    <div class="m-ops" v-if="nav.sheet === 'secret' && sec.cur" @click.self="laterSecret">
      <section class="m-ops-panel" role="dialog" aria-modal="true" :aria-label="SECRET_TEXT.title">
        <h2 class="m-ops-h">{{ SECRET_TEXT.title }}</h2>
        <p class="m-ops-lead">{{ SECRET_TEXT.lead }}</p>
        <dl class="m-ops-rows">
          <dt>{{ SECRET_TEXT.deviceLabel }}</dt><dd>{{ sec.cur.nodeName }}</dd>
          <dt>{{ SECRET_TEXT.programLabel }}</dt><dd>{{ sec.cur.program }}</dd>
          <dt>{{ SECRET_TEXT.purposeLabel }}</dt><dd>{{ sec.cur.purpose }}</dd>
          <dt>{{ SECRET_TEXT.fpLabel }}</dt><dd>{{ sec.cur.fingerprint }}</dd>
        </dl>
        <p class="m-note">{{ SECRET_TEXT.fpNote }}　{{ secCountdown }}</p>
        <label class="m-field">{{ SECRET_TEXT.inputLabel }}<input class="set-input m-ops-input" type="password" v-model="sec.secret" autocomplete="off" autocapitalize="off" spellcheck="false" :disabled="sec.busy" @keydown.enter.prevent="answerSecret(false)"></label>
        <p class="m-err" v-if="sec.error" role="alert">{{ sec.error }}</p>
        <button type="button" class="m-btn m-btn-big" :disabled="sec.busy" @click="answerSecret(false)">{{ SECRET_TEXT.ok }}</button>
        <button type="button" class="m-btn m-ops-cancel m-danger" :disabled="sec.busy" @click="answerSecret(true)">{{ SECRET_TEXT.deny }}</button>
        <button type="button" class="m-btn m-ops-cancel" :disabled="sec.busy" @click="laterSecret">{{ SECRET_TEXT.later }}</button>
      </section>
    </div>
  </template>
</div>
<script src="vendor/vue.global.prod.js"></script>
<script type="module" src="m.js"></script>
</body>
</html>
