<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Sync Network Messenger</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" class="win" v-cloak>
  <i class="rz" v-for="d in RESIZE_DIRS" :key="d" :class="'rz-' + d" @mousedown.left.prevent="resizeFrom(d)"></i>
  <header class="titlebar" data-tauri-drag-region>
    <span class="t-icon"></span><span class="t-text"><span class="brand">Agent Sync Network Messenger</span></span>
    <span class="t-btns">
      <button class="tb" @click="ctl('min')" aria-label="最小化" title="最小化"><svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><rect x="2" y="8" width="8" height="2" rx=".5" fill="currentColor"/></svg></button>
      <button class="tb close" @click="quit" aria-label="關閉並結束" title="關閉"><svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M2.6 2.6l6.8 6.8M9.4 2.6l-6.8 6.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    </span>
  </header>
  <div class="pane login-pane">
    <div class="login-sky" aria-hidden="true">
      <svg viewBox="0 0 360 300" preserveAspectRatio="none" focusable="false">
        <defs>
          <linearGradient id="lg-r1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
          <linearGradient id="lg-r2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9fd2f1" stop-opacity="0"/><stop offset=".55" stop-color="#9fd2f1" stop-opacity=".7"/><stop offset="1" stop-color="#9fd2f1" stop-opacity="0"/></linearGradient>
        </defs>
        <path d="M-20 150 C60 60 140 190 230 110 S350 60 390 100 L390 150 C320 120 250 200 160 170 S40 110 -20 190Z" fill="url(#lg-r1)"/>
        <path d="M-20 90 C70 150 150 20 250 80 S340 140 390 60 L390 100 C330 180 250 60 160 110 S40 190 -20 130Z" fill="url(#lg-r2)"/>
        <path d="M-20 215 C80 160 170 250 270 190 S350 170 390 200 L390 235 C320 215 250 270 160 240 S60 200 -20 250Z" fill="url(#lg-r1)" opacity=".8"/>
      </svg>
    </div>
    <div class="login-card">
      <div class="login-avatar" :class="{ 'is-logo': !lastAvatar }">
        <img :src="lastAvatar || 'img/logo.svg'" alt="" draggable="false">
      </div>
      <h1 class="login-h">歡迎使用 ASN</h1>
      <p class="login-sub">登入後，這台電腦會自動出現在你的名單裡。</p>
      <button v-for="p in PROVIDERS" :key="p.key" class="aero-btn login-btn" type="button" :disabled="!canStart(phase)" @click="start(p.key)">{{ p.label }}<span class="login-last" v-if="lastProvider === p.key">{{ LAST_USED_LABEL }}</span></button>
      <p class="login-note" v-if="note" role="status">{{ note }}</p>
      <button class="aero-btn login-cancel" type="button" v-if="phase === 'waiting'" @click="cancel">取消</button>
      <button class="login-skip" type="button" v-if="showSkip(canSkip, phase)" @click="skip">{{ SKIP_LABEL }}</button>
      <p class="login-err" v-if="phase === 'error'" role="alert">{{ error }}</p>
    </div>
  </div>
</div>
<script src="vendor/vue.global.prod.js"></script>
<script type="module" src="login.js"></script>
</body>
</html>
