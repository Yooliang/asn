<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>正見</title>
<style>
  /* 廣告大頁：純靜態、自帶樣式、不引用任何外部資源、沒有腳本與連結（在 ASN 裡點不到）。動畫只用 CSS */
  html,body{margin:0;height:100%;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Microsoft JhengHei","PingFang TC",sans-serif;
    background:linear-gradient(135deg,#d9f3ec,#bfe3f5 60%,#dbe9f7);color:#12403a}
  .card{position:relative;z-index:1;max-width:70%;padding:0 6%}
  h1{margin:0 0 10px;font-size:clamp(32px,7vw,64px);letter-spacing:.08em}
  p{margin:0;font-size:clamp(15px,2.6vw,24px);line-height:1.6;color:#2b5a52}
  .bar{margin-top:22px;display:flex;gap:8px;align-items:flex-end;height:60px}
  .bar i{display:block;width:16px;border-radius:3px 3px 0 0;background:#2f9e87;animation:grow 2.4s ease-in-out infinite}
  .bar i:nth-child(2){animation-delay:.25s;background:#3aa6c8}
  .bar i:nth-child(3){animation-delay:.5s}
  .bar i:nth-child(4){animation-delay:.75s;background:#3aa6c8}
  .bar i:nth-child(5){animation-delay:1s}
  .orb{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 10%,#4cc3aa 50%,#1f7a68);opacity:.85;animation:float 7s ease-in-out infinite}
  .o1{width:30vmin;height:30vmin;right:6%;top:12%}
  .o2{width:18vmin;height:18vmin;right:26%;bottom:10%;animation-delay:-2s;filter:hue-rotate(40deg)}
  @keyframes grow{0%,100%{height:14px}50%{height:58px}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
  @media (prefers-reduced-motion:reduce){.bar i,.orb{animation:none}.bar i{height:36px}}
</style>
</head>
<body>
  <div class="orb o1"></div><div class="orb o2"></div>
  <div class="card">
    <h1>正見</h1>
    <p>追蹤政見做到多少，<br>每一筆都附來源。</p>
    <div class="bar"><i></i><i></i><i></i><i></i><i></i></div>
  </div>
</body>
</html>
